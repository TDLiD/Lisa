<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no,viewport-fit=cover">
    <title>2026-08 Singapore</title>
<link rel="icon" href="data:;base64,iVBORw0KGgo=">
    <script src="music/music_list.js"></script>
    <style>
        :root{
            --neon-blue:#00d4ff;
            --neon-pink:#ff006e;
            --neon-purple:#8b5cf6;
            --neon-cyan:#22d3ee;
            --cyber-dark:#0a0e27;
        }
        
        *{margin:0;padding:0;box-sizing:border-box}
        
        body{
            margin:0;
            background:#000;
            color:white;
            font-family:'Orbitron','Inter',sans-serif;
            overflow:hidden;
            height:100dvh;
            position:fixed;
            width:100%;
        }
        
        /* ═══ CYBER GRID BACKGROUND ═══ */
        #cyber-grid{
            position:fixed;
            inset:0;
            z-index:-3;
            background:
                linear-gradient(0deg, transparent 24%, rgba(0,212,255,.03) 25%, rgba(0,212,255,.03) 26%, transparent 27%, transparent 74%, rgba(0,212,255,.03) 75%, rgba(0,212,255,.03) 76%, transparent 77%, transparent),
                linear-gradient(90deg, transparent 24%, rgba(255,0,110,.03) 25%, rgba(255,0,110,.03) 26%, transparent 27%, transparent 74%, rgba(255,0,110,.03) 75%, rgba(255,0,110,.03) 76%, transparent 77%, transparent);
            background-size:50px 50px;
            background-position:0 0;
            animation:gridMove 20s linear infinite;
        }
        @keyframes gridMove{
            from{background-position:0 0}
            to{background-position:50px 50px}
        }
        
        /* ═══ HOLOGRAPHIC SCANLINES ═══ */
        #scanlines{
            position:fixed;
            inset:0;
            z-index:-2;
            background:repeating-linear-gradient(
                0deg,
                rgba(0,212,255,0.03) 0px,
                rgba(0,212,255,0.03) 1px,
                transparent 1px,
                transparent 2px
            );
            pointer-events:none;
            animation:scan 8s linear infinite;
        }
        @keyframes scan{
            from{transform:translateY(0)}
            to{transform:translateY(100%)}
        }
        
        /* ═══ NEON GLITCH ORBS ═══ */
        .neon-orb{
            position:fixed;
            border-radius:50%;
            filter:blur(100px);
            opacity:0.4;
            pointer-events:none;
            z-index:-1;
            animation:glitchFloat 15s ease-in-out infinite;
        }
        .orb1{
            top:10%;left:10%;
            width:400px;height:400px;
            background:radial-gradient(circle,var(--neon-blue),transparent);
            animation-delay:0s;
        }
        .orb2{
            bottom:10%;right:10%;
            width:500px;height:500px;
            background:radial-gradient(circle,var(--neon-pink),transparent);
            animation-delay:5s;
        }
        .orb3{
            top:50%;left:50%;
            width:450px;height:450px;
            background:radial-gradient(circle,var(--neon-purple),transparent);
            animation-delay:10s;
        }
        @keyframes glitchFloat{
            0%,100%{transform:translate(0,0) scale(1)}
            25%{transform:translate(50px,-30px) scale(1.15)}
            50%{transform:translate(-40px,40px) scale(0.9)}
            75%{transform:translate(30px,-50px) scale(1.1)}
        }
        
        /* ═══ HEXAGON PARTICLES ═══ */
        .hex-particles{
            position:fixed;
            inset:0;
            pointer-events:none;
            z-index:1;
        }
        .hex{
            position:absolute;
            width:8px;
            height:8px;
            background:var(--neon-cyan);
            clip-path:polygon(50% 0%, 100% 25%, 100% 75%, 50% 100%, 0% 75%, 0% 25%);
            opacity:0;
            animation:hexFloat 18s infinite;
            box-shadow:0 0 15px var(--neon-cyan);
        }
        @keyframes hexFloat{
            0%{transform:translateY(100vh) rotate(0deg);opacity:0}
            10%{opacity:0.6}
            90%{opacity:0.6}
            100%{transform:translateY(-20vh) rotate(360deg);opacity:0}
        }
        
        /* ═══ MAIN GALLERY CONTAINER ═══ */
        #main-scroller{
            position:absolute;
            inset:0;
            overflow:hidden;
            perspective:3000px;
            z-index:2;
        }
        
        #gallery-scene{
            position:absolute;
            top:50%;
left: 0;  /* 50%에서 0으로 변경 */
            width:100%;
            height:100%;
            transform-style:preserve-3d;
            transition:all 0.8s;
        }
        
        /* ═══ HOLOGRAPHIC PHOTO CARDS ═══ */
        .holo-card{
            position:absolute;
            width:160px;
            height:200px;
            left:0;
            top:0;
            border-radius:20px;
            border:2px solid var(--neon-blue);
            background:rgba(10,14,39,0.7);
            overflow:hidden;
            cursor:pointer;
            transition:all 0.6s cubic-bezier(0.23,1,0.32,1);
            filter:brightness(0.85) saturate(0.9);
            backface-visibility:hidden;
            box-shadow:
                0 0 30px rgba(0,212,255,0.4),
                0 15px 40px rgba(0,0,0,0.7),
                inset 0 0 20px rgba(0,212,255,0.1);
            transform-style:preserve-3d;
            animation:holoRise linear infinite;
        }
        
        /* Holographic shimmer effect */
        .holo-card::before{
            content:'';
            position:absolute;
            inset:-50%;
            background:linear-gradient(
                45deg,
                transparent,
                rgba(0,212,255,0.3),
                rgba(255,0,110,0.3),
                transparent
            );
            transform:translateX(-100%) rotate(45deg);
            transition:transform 0.8s;
        }
        
        .holo-card:hover::before{
            transform:translateX(100%) rotate(45deg);
        }
        

        
        .holo-card:hover{
            filter:brightness(1.3) saturate(1.3);
            border-color:var(--neon-pink);
            transform:translateZ(80px) scale(1.15) rotateY(10deg);
            box-shadow:
                0 0 60px rgba(255,0,110,0.8),
                0 25px 80px rgba(0,0,0,0.9),
                inset 0 0 40px rgba(255,0,110,0.2);
        }
        
        .holo-card img{
            width:100%;
            height:100%;
            object-fit:cover;
            transition:transform 0.6s;
            border-radius:18px;
            mix-blend-mode:screen;
            opacity:0.95;
        }
        
        .holo-card:hover img{
            transform:scale(1.1);
            opacity:1;
        }
        
        /* Data overlay on cards */
        .holo-card::after{
            content:'';
            position:absolute;
            bottom:0;
            left:0;
            right:0;
            height:40px;
            background:linear-gradient(to top, rgba(0,212,255,0.6), transparent);
            opacity:0;
            transition:opacity 0.4s;
            pointer-events:none;
        }
        .holo-card:hover::after{opacity:1}
        
        @media (max-width:768px){
            .holo-card{
                width:120px;
                height:150px;
            }
        }
        
        /* ═══ NAVIGATION ═══ */
        .nav{
            position:fixed;
            top:max(20px,env(safe-area-inset-top));
            left:20px;
            z-index:10000;
        }
        
        .cyber-btn{
            padding:12px 24px;
            border:2px solid var(--neon-cyan);
            color:var(--neon-cyan);
            text-decoration:none;
            background:rgba(0,0,0,0.8);
            backdrop-filter:blur(20px);
            border-radius:30px;
            font-weight:bold;
            font-size:11px;
            text-transform:uppercase;
            letter-spacing:2px;
            box-shadow:
                0 0 20px rgba(34,211,238,0.4),
                0 5px 20px rgba(0,0,0,0.6);
            transition:all 0.3s;
            position:relative;
            overflow:hidden;
        }
        
        .cyber-btn::before{
            content:'';
            position:absolute;
            inset:0;
            background:linear-gradient(45deg, transparent, rgba(34,211,238,0.2), transparent);
            transform:translateX(-100%);
            transition:transform 0.6s;
        }
        
        .cyber-btn:hover{
            background:rgba(34,211,238,0.1);
            transform:translateY(-3px);
            box-shadow:
                0 0 40px rgba(34,211,238,0.8),
                0 10px 30px rgba(0,0,0,0.8);
        }
        
        .cyber-btn:hover::before{
            transform:translateX(100%);
        }
        
        /* ═══ BOTTOM CONTROLS ═══ */
        .bottom-nav{
            position:fixed;
            bottom:max(20px,env(safe-area-inset-bottom));
            left:20px;
            z-index:9999;
            display:flex;
            align-items:center;
            gap:15px;
        }
        
        #heart-btn{
            width:55px;
            height:55px;
            flex-shrink:0;
            background:linear-gradient(135deg, var(--neon-pink), #c20055);
            border-radius:50%;
            display:flex;
            align-items:center;
            justify-content:center;
            cursor:pointer;
            border:2px solid var(--neon-pink);
            box-shadow:
                0 0 30px rgba(255,0,110,0.6),
                0 10px 30px rgba(255,0,110,0.4);
            transition:all 0.3s;
        }
        
        #heart-btn:hover{
            transform:scale(1.15) rotate(5deg);
            box-shadow:
                0 0 50px rgba(255,0,110,1),
                0 15px 40px rgba(255,0,110,0.6);
        }
        
        #ai-scan-btn{
            height:55px;
            padding:0 30px;
            background:linear-gradient(135deg, rgba(0,212,255,0.2), rgba(139,92,246,0.2));
            border:2px solid var(--neon-blue);
            color:var(--neon-blue);
            border-radius:28px;
            cursor:pointer;
            font-weight:900;
            font-size:11px;
            text-transform:uppercase;
            letter-spacing:2px;
            backdrop-filter:blur(20px);
            box-shadow:
                0 0 30px rgba(0,212,255,0.4),
                0 10px 30px rgba(0,0,0,0.6);
            transition:all 0.3s;
            position:relative;
            overflow:hidden;
        }
        
        #ai-scan-btn::before{
            content:'';
            position:absolute;
            top:-50%;
            left:-50%;
            width:200%;
            height:200%;
            background:conic-gradient(
                from 0deg,
                transparent,
                rgba(0,212,255,0.4),
                transparent
            );
            animation:rotate 3s linear infinite;
        }
        
        @keyframes rotate{
            from{transform:rotate(0deg)}
            to{transform:rotate(360deg)}
        }
        
        #ai-scan-btn:hover{
            transform:translateY(-4px);
            background:linear-gradient(135deg, rgba(0,212,255,0.4), rgba(139,92,246,0.4));
            box-shadow:
                0 0 50px rgba(0,212,255,0.8),
                0 15px 40px rgba(0,212,255,0.5);
        }
        
        /* ═══ MUSIC PLAYER ═══ */
        #p-cont{
            position:fixed;
            bottom:max(20px,env(safe-area-inset-bottom));
            right:20px;
            width:280px;
            background:linear-gradient(135deg, rgba(10,14,39,0.95), rgba(20,25,60,0.9));
            backdrop-filter:blur(30px) saturate(180%);
            border:2px solid var(--neon-purple);
            border-radius:24px;
            z-index:1000000;
            padding:20px;
            box-shadow:
                0 0 40px rgba(139,92,246,0.5),
                0 25px 60px rgba(0,0,0,0.8),
                inset 0 0 20px rgba(139,92,246,0.1);
            touch-action:none;
            transition:all 0.3s;
        }
        
        #p-cont::before{
            content:'';
            position:absolute;
            inset:0;
            border-radius:24px;
            background:linear-gradient(45deg, transparent, rgba(139,92,246,0.2), transparent);
            animation:shimmer 4s ease-in-out infinite;
        }
        
        @keyframes shimmer{
            0%,100%{transform:translateX(-100%)}
            50%{transform:translateX(100%)}
        }
        
        #p-cont:hover{
            transform:translateY(-5px);
            box-shadow:
                0 0 60px rgba(139,92,246,0.8),
                0 30px 80px rgba(0,0,0,0.9),
                inset 0 0 30px rgba(139,92,246,0.2);
        }
        
        @media (max-width:480px){
            #p-cont{
                width:calc(100% - 40px);
                left:20px;
                right:20px;
            }
        }
        
        .p-header{
            display:flex;
            align-items:center;
            gap:12px;
            margin-bottom:15px;
            pointer-events:none;
            position:relative;
            z-index:1;
        }
        
        .eq{
            display:flex;
            align-items:flex-end;
            gap:3px;
            height:16px;
            padding:5px;
            background:rgba(0,212,255,0.15);
            border-radius:10px;
            border:1px solid rgba(0,212,255,0.3);
        }
        
        .eq span{
            width:4px;
            background:linear-gradient(to top, var(--neon-cyan), var(--neon-blue));
            animation:eq 0.8s ease-in-out infinite alternate;
            border-radius:2px;
            box-shadow:0 0 10px var(--neon-cyan);
        }
        
        .eq span:nth-child(2){animation-delay:0.1s}
        .eq span:nth-child(3){animation-delay:0.2s}
        .eq span:nth-child(4){animation-delay:0.3s}
        
        @keyframes eq{
            0%{height:4px}
            100%{height:16px}
        }
        
        .paused .eq span{
            animation-play-state:paused;
            height:4px;
        }
        
        .np-c{flex:1;overflow:hidden}
        
        #t-name{
            font-size:12px;
            font-weight:700;
            white-space:nowrap;
            overflow:hidden;
            text-overflow:ellipsis;
            color:var(--neon-cyan);
            text-shadow:0 0 10px rgba(34,211,238,0.6);
        }
        
        .ctrls{
            display:grid;
            grid-template-columns:repeat(4,1fr);
            gap:10px;
            margin:12px 0;
            position:relative;
            z-index:1;
        }
        
        .ctrls button{
            background:linear-gradient(135deg, rgba(0,212,255,0.2), rgba(139,92,246,0.2));
            border:1px solid rgba(255,255,255,0.2);
            color:white;
            cursor:pointer;
            border-radius:14px;
            height:40px;
            font-size:12px;
            font-weight:700;
            transition:all 0.3s;
            box-shadow:0 5px 15px rgba(0,0,0,0.4);
        }
        
        .ctrls button:hover{
            background:linear-gradient(135deg, rgba(0,212,255,0.4), rgba(139,92,246,0.4));
            border-color:var(--neon-cyan);
            transform:translateY(-2px);
            box-shadow:
                0 0 20px rgba(0,212,255,0.6),
                0 8px 25px rgba(0,0,0,0.6);
        }
        
        .s-list{
            max-height:70px;
            overflow-y:auto;
            font-size:10px;
            background:rgba(0,0,0,0.5);
            border-radius:14px;
            padding:8px;
            position:relative;
            z-index:1;
            border:1px solid rgba(139,92,246,0.3);
        }
        
        .s-list::-webkit-scrollbar{width:5px}
        .s-list::-webkit-scrollbar-track{background:rgba(0,0,0,0.3);border-radius:5px}
        .s-list::-webkit-scrollbar-thumb{
            background:linear-gradient(to bottom, var(--neon-cyan), var(--neon-purple));
            border-radius:5px;
            box-shadow:0 0 10px var(--neon-cyan);
        }
        
        .s-item{
            padding:8px 10px;
            cursor:pointer;
            border-radius:10px;
            opacity:0.6;
            transition:all 0.3s;
            position:relative;
        }
        
        .s-item::before{
            content:'';
            position:absolute;
            left:0;
            top:50%;
            width:3px;
            height:0;
            background:linear-gradient(to bottom, var(--neon-cyan), var(--neon-pink));
            transition:0.3s;
            transform:translateY(-50%);
            border-radius:2px;
        }
        
        .s-item:hover{
            opacity:0.9;
            background:rgba(255,255,255,0.05);
            padding-left:14px;
        }
        
        .s-item:hover::before{
            height:70%;
            box-shadow:0 0 10px var(--neon-cyan);
        }
        
        .s-item.active{
            opacity:1;
            background:linear-gradient(90deg, rgba(0,212,255,0.3), rgba(255,0,110,0.2));
            color:var(--neon-cyan);
            font-weight:700;
            box-shadow:0 0 20px rgba(0,212,255,0.4);
            padding-left:14px;
        }
        
        .s-item.active::before{
            height:80%;
            box-shadow:0 0 15px var(--neon-cyan);
        }
        
        /* ═══ SCAN OVERLAY ═══ */
        #proc-ov{
            position:fixed;
            inset:0;
            background:rgba(0,0,0,0.95);
            display:none;
            flex-direction:column;
            align-items:center;
            justify-content:center;
            z-index:2000000;
            backdrop-filter:blur(20px);
        }
        
        #proc-ov > div:first-child{
            color:var(--neon-cyan);
            letter-spacing:4px;
            font-size:16px;
            font-weight:900;
            text-shadow:0 0 30px var(--neon-cyan);
            animation:glitchText 0.3s infinite;
        }
        
        @keyframes glitchText{
            0%{transform:translate(0)}
            20%{transform:translate(-2px,2px)}
            40%{transform:translate(-2px,-2px)}
            60%{transform:translate(2px,2px)}
            80%{transform:translate(2px,-2px)}
            100%{transform:translate(0)}
        }
        
        .loader{
            width:240px;
            height:6px;
            background:rgba(0,212,255,0.2);
            margin-top:30px;
            border-radius:6px;
            position:relative;
            overflow:hidden;
            box-shadow:0 0 20px rgba(0,212,255,0.3) inset;
        }
        
        .l-bar{
            width:0%;
            height:100%;
            background:linear-gradient(90deg, var(--neon-cyan), var(--neon-pink), var(--neon-purple));
            background-size:200% 100%;
            position:absolute;
            transition:width 0.2s;
            border-radius:6px;
            box-shadow:0 0 30px var(--neon-cyan);
            animation:shimmer 2s linear infinite;
        }
        
        /* ═══ MODAL ═══ */
        #modal{
            position:fixed;
            inset:0;
            background:rgba(0,0,0,0.95);
            display:none;
            align-items:center;
            justify-content:center;
            z-index:3000000;
            backdrop-filter:blur(20px);
        }
        
        #modal img{
            max-width:90%;
            max-height:85%;
            border-radius:16px;
            box-shadow:
                0 0 80px rgba(0,212,255,0.6),
                0 0 40px rgba(255,0,110,0.4),
                0 30px 100px rgba(0,0,0,0.9);
            object-fit:contain;
            border:3px solid var(--neon-blue);
            animation:modalZoomIn 0.5s ease-out;
        }
        
        @keyframes modalZoomIn{
            from{opacity:0;transform:scale(0.8) rotateY(-10deg)}
            to{opacity:1;transform:scale(1) rotateY(0)}
        }
        
        /* ═══ GRID MODE ═══ */
        body.grid-mode #main-scroller{
            overflow-y:auto !important;
            -webkit-overflow-scrolling:touch;
        }
        
        body.grid-mode #gallery-scene{
            animation:none !important;
            transform:none !important;
            position:relative !important;
            top:0 !important;
            left:0 !important;
            width:100% !important;
            height:auto !important;
            display:grid !important;
            grid-template-columns:repeat(auto-fill, minmax(160px,1fr)) !important;
            gap:20px !important;
            padding:120px 25px 220px 25px !important;
        }
        
        body.grid-mode .holo-card{
            position:relative !important;
            left:0 !important;
            top:0 !important;
            width:100% !important;
            height:auto !important;
            aspect-ratio:1/1.25 !important;
            transform:none !important;
            filter:brightness(1) saturate(1) !important;
            opacity:1 !important;
            animation:none !important;
        }
        
        @media (max-width:768px){
            body.grid-mode #gallery-scene{
                grid-template-columns:repeat(auto-fill, minmax(120px,1fr)) !important;
                gap:15px !important;
            }
        }
        
        /* ═══ ENTRANCE ANIMATIONS ═══ */
        @keyframes fadeIn{
            from{opacity:0;transform:translateY(20px)}
            to{opacity:1;transform:translateY(0)}
        }
        
        .nav{animation:fadeIn 0.8s ease-out}
        .bottom-nav{animation:fadeIn 1s ease-out 0.2s both}
        #p-cont{animation:fadeIn 1.2s ease-out 0.4s both}
/* 1. 기존 holoRise 삭제 후 waterfall 애니메이션 추가 */
@keyframes waterfall {
    from { transform: translateY(-100vh) translateZ(0); opacity: 0; }
    10% { opacity: 1; }
    90% { opacity: 1; }
    to { transform: translateY(100vh) translateZ(0); opacity: 0; }
}

/* 2. .holo-card의 위치 및 애니메이션 속성 수정 */
.holo-card {
    position: absolute;
    width: 160px;
    height: 200px;
    top: -250px; /* 화면 위쪽에서 시작하도록 설정 */
    left: 50;
margin-left: -80px; /* 카드 너비의 절반만큼 왼쪽으로 밀어 정확히 중앙 정렬 */
    object-fit: cover;
    border-radius: 20px;
    /* ... 기존 디자인 속성(border, box-shadow 등)은 유지 ... */
    animation: waterfall linear infinite;
}
    </style>
</head>
<body>
    <!-- Background Effects -->
    <div id="cyber-grid"></div>
    <div id="scanlines"></div>
    <div class="neon-orb orb1"></div>
    <div class="neon-orb orb2"></div>
    <div class="neon-orb orb3"></div>
    <div class="hex-particles" id="hex-particles"></div>
    
    <!-- Navigation -->
    <nav class="nav">
        <a href="index.html" class="cyber-btn">← EXIT</a>
    </nav>
    
    <!-- Main Gallery -->
    <div id="main-scroller">
        <div id="gallery-scene"></div>
    </div>
    
    <!-- Bottom Controls -->
    <div class="bottom-nav">
        <button id="heart-btn">
            <svg viewBox="0 0 24 24" width="26" height="26" fill="white">
                <path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/>
            </svg>
        </button>
        <button id="ai-scan-btn">◈ SCAN BEST PHOTO ◈</button>
    </div>
    
    <!-- Music Player -->
    <div id="p-cont" class="paused">
        <div class="p-header">
            <div class="eq">
                <span></span><span></span><span></span><span></span>
            </div>
            <div class="np-c">
                <div style="font-size:8px;color:var(--neon-cyan);text-transform:uppercase;letter-spacing:2px;opacity:0.7">Now Playing</div>
                <div id="t-name">READY</div>
            </div>
        </div>
        <div class="ctrls">
            <button onclick="prevT()">◁◁</button>
            <button id="p-btn" onclick="toggleP()">PLAY</button>
            <button onclick="stopT()">■</button>
            <button onclick="nextT()">▷▷</button>
        </div>
        <div class="s-list" id="pl"></div>
        <audio id="audio" playsinline></audio>
    </div>
    
    <!-- Scan Overlay -->
    <div id="proc-ov">
        <div>◈ AI SCANNING ◈</div>
        <div class="loader">
            <div class="l-bar" id="p-bar"></div>
        </div>
    </div>
    
    <!-- Modal -->
    <div id="modal" onclick="closeM()">
        <img id="m-img" src="">
    </div>
    
<script>
    const audio=document.getElementById('audio');
    const pBtn=document.getElementById('p-btn');
    const tName=document.getElementById('t-name');
    const plEl=document.getElementById('pl');
    const pCont=document.getElementById('p-cont');
    const tracks=typeof EXTERNAL_TRACKS!=='undefined'?EXTERNAL_TRACKS:[];
    const scene=document.getElementById('gallery-scene');
    const modal=document.getElementById('modal');
    const mImg=document.getElementById('m-img');
    let cIdx=0, cards=[];
    
    // Create hexagon particles
    function createHexParticles(){
        const container=document.getElementById('hex-particles');
        for(let i=0;i<30;i++){
            const hex=document.createElement('div');
            hex.className='hex';
            hex.style.left=Math.random()*100+'%';
            hex.style.animationDelay=Math.random()*18+'s';
            hex.style.animationDuration=(12+Math.random()*12)+'s';
            container.appendChild(hex);
        }
    }
    
async function loadG() {
    try {
        const res = await fetch('images/photos.json'),
              data = await res.json(),
              photos = data["2026_08"] || [];
        
        photos.forEach((f, i) => {
            const src = `images/2026-08/${f}`,
                  img = document.createElement('div');
            
            img.className = 'holo-card';
            img.innerHTML = `<img src="${src}">`;

            // --- 위치 및 애니메이션 로직 수정 ---
            // 화면 중앙(50%)을 기준으로 -45% ~ +45% 범위 내에서 랜덤 배치
            const leftPos = 50 + (Math.random() * 90 - 45); 
            const duration = 12 + Math.random() * 18;
            const delay = Math.random() * -25;

            img.style.left = leftPos + '%';
            img.style.animationDuration = duration + 's';
            img.style.animationDelay = delay + 's';
            // ----------------------------------

            img.onclick = (e) => { 
                e.stopPropagation(); 
                openM(src); 
                if(audio.paused) toggleP(); 
            };
            
            scene.appendChild(img);
            cards.push(img);
        });
    } catch(e) { console.error(e); }
}
    
    // Grid toggle
    document.getElementById('heart-btn').onclick=()=>{
        const isGrid=document.body.classList.toggle('grid-mode');
        const scroller=document.getElementById('main-scroller');
        
cards.forEach(c => {
        // 그리드 모드일 때는 waterfall 애니메이션 제거, 아닐 때는 다시 적용
        c.style.animation = isGrid ? 'none' : 'waterfall linear infinite';
    });
        
        if(isGrid)scroller.scrollTo({top:0,behavior:'smooth'});
        if(audio.paused)toggleP();
    };
    
    // AI scan
    document.getElementById('ai-scan-btn').onclick=()=>{
        const ov=document.getElementById('proc-ov');
        const bar=document.getElementById('p-bar');
        ov.style.display='flex';
        bar.style.width='0%';
        setTimeout(()=>bar.style.width='100%',100);
        setTimeout(()=>{
            ov.style.display='none';
            const randomCard=cards[Math.floor(Math.random()*cards.length)];
            openM(randomCard.querySelector('img').src);
        },1500);
    };
    
    // Modal
    function openM(s){mImg.src=s;modal.style.display='flex'}
    function closeM(){modal.style.display='none'}
    
    // Music player
    function initP(){
        if(!tracks.length)return;
        plEl.innerHTML=tracks.map((t,i)=>
            `<div class="s-item ${i===cIdx?'active':''}" onclick="loadT(${i})">
                ${String(i+1).padStart(2,'0')} ${t.replace('.mp3','').replace(/_/g,' ')}
            </div>`
        ).join('');
        loadT(cIdx,false);
    }
    
    function loadT(idx,a=true){
        cIdx=idx;
        audio.src=`music/${tracks[idx]}`;
        tName.innerText=tracks[idx].replace('.mp3','').replace(/_/g,' ');
        document.querySelectorAll('.s-item').forEach((it,i)=>
            it.classList.toggle('active',i===idx)
        );
        if(a)audio.play().then(()=>updUI(true)).catch(e=>{});
        else updUI(false);
    }
    
    function toggleP(){
        if(audio.paused)
            audio.play().then(()=>updUI(true)).catch(e=>{});
        else{
            audio.pause();
            updUI(false);
        }
    }
    
    function updUI(p){
        pCont.classList.toggle('paused',!p);
        pBtn.innerText=p?"PAUSE":"PLAY";
    }
    
    function nextT(){
        cIdx=(cIdx+1)%tracks.length;
        loadT(cIdx);
    }
    
    function prevT(){
        cIdx=(cIdx-1+tracks.length)%tracks.length;
        loadT(cIdx);
    }
    
    function stopT(){
        audio.pause();
        audio.currentTime=0;
        updUI(false);
    }
    
    audio.onended=nextT;
    
    // Drag support
    let isDrag=false,sX,sY,iX,iY;
    
    const dragStart=(e)=>{
        if(e.target.closest('button')||e.target.closest('.s-list'))return;
        isDrag=true;
        const c=e.type.includes('touch')?e.touches[0]:e;
        const r=pCont.getBoundingClientRect();
        sX=c.clientX;
        sY=c.clientY;
        iX=r.left;
        iY=r.top;
    };
    
    const dragMove=(e)=>{
        if(!isDrag)return;
        const c=e.type.includes('touch')?e.touches[0]:e;
        pCont.style.left=`${iX+(c.clientX-sX)}px`;
        pCont.style.top=`${iY+(c.clientY-sY)}px`;
        pCont.style.right='auto';
        pCont.style.bottom='auto';
    };
    
    pCont.addEventListener('mousedown',dragStart);
    pCont.addEventListener('touchstart',dragStart);
    window.addEventListener('mousemove',dragMove);
    window.addEventListener('touchmove',dragMove,{passive:false});
    window.addEventListener('mouseup',()=>isDrag=false);
    window.addEventListener('touchend',()=>isDrag=false);
    
    // Initialize
    window.onload=()=>{
        createHexParticles();
        loadG();
        initP();
    };
</script>

</body>
</html>
