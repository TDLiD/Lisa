<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
    <title>2026 Future Hub</title>
    <script src="music/music_list.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Syne:wght@800;900&family=Space+Mono:wght@700&display=swap" rel="stylesheet">
<link rel="icon" href="data:;base64,iVBORw0KGgo=">
    <style>
        :root{
            --accent:#00ffa3;
            --glass:rgba(15,23,42,0.8);
            --heart-red:#ff4d6d;
            --purple:#a78bfa;
            --blue:#3b82f6;
            --cyan:#22d3ee;
            --bg:#020205;
        }
        *{margin:0;padding:0;box-sizing:border-box}

        body{
            margin:0;
            background:var(--bg);
            color:white;
            font-family:'Syne',sans-serif;
            overflow:hidden;
            height:100dvh;
            position:relative;
            perspective:1200px;
        }

/* ── 4D LAYERED BACKGROUND ── */
#bg-canvas{
    position:fixed;top:0;left:0;
    width:100%;height:100%;
    z-index:0;pointer-events:none;
    filter: brightness(1.1) contrast(1.1);
}

/* Deep space grid floor - 3D perspective */
.grid-floor{
    position:fixed;
    bottom:0;left:50%;
    transform:translateX(-50%);
    width:200%;height:60%;
    background:
        linear-gradient(rgba(0,255,163,0.08) 1px,transparent 1px),
        linear-gradient(90deg,rgba(0,255,163,0.08) 1px,transparent 1px),
        radial-gradient(ellipse at center, rgba(0,255,163,0.15) 0%, transparent 70%);
    background-size:60px 60px, 60px 60px, 100% 100%;
    transform-origin:bottom center;
    transform:translateX(-50%) rotateX(75deg) perspective(1200px);
    z-index:1;
    pointer-events:none;
    animation:gridPulse 8s ease-in-out infinite, gridShift 20s ease-in-out infinite;
    box-shadow: 
        inset 0 -100px 200px rgba(0,255,163,0.1),
        inset 0 0 100px rgba(34,211,238,0.08);
}
@keyframes gridPulse{
    0%,100%{opacity:0.3}
    50%{opacity:0.7}
}
@keyframes gridShift{
    0%, 100% { background-position: 0 0, 0 0, 0 0; }
    50% { background-position: 30px 30px, 30px 30px, 0 0; }
}

/* Orbiting energy rings - Enhanced 3D */
.orbit-ring{
    position:fixed;
    border-radius:50%;
    border:1px solid;
    pointer-events:none;
    z-index:1;
    top:50%;left:50%;
    transform-origin:center center;
    filter: drop-shadow(0 0 20px currentColor);
    box-shadow: 0 0 40px currentColor inset;
}
.ring-1{
    width:500px;height:500px;
    margin:-250px 0 0 -250px;
    border-color:rgba(0,255,163,0.3);
    transform:rotateX(75deg) rotateZ(0deg) perspective(1500px);
    animation:orbitSpin 20s linear infinite, ringFloat 6s ease-in-out infinite;
    box-shadow:
        0 0 30px rgba(0,255,163,0.2) inset,
        0 0 50px rgba(0,255,163,0.15),
        inset -40px -40px 80px rgba(0,255,163,0.08);
}
.ring-2{
    width:700px;height:700px;
    margin:-350px 0 0 -350px;
    border-color:rgba(167,139,250,0.25);
    transform:rotateX(70deg) rotateZ(30deg) perspective(1500px);
    animation:orbitSpin 35s linear infinite reverse, ringFloat 7s ease-in-out infinite;
    box-shadow:
        0 0 40px rgba(167,139,250,0.2) inset,
        0 0 60px rgba(167,139,250,0.12),
        inset -50px -50px 100px rgba(167,139,250,0.06);
}
.ring-3{
    width:900px;height:900px;
    margin:-450px 0 0 -450px;
    border-color:rgba(34,211,238,0.2);
    transform:rotateX(72deg) rotateZ(-20deg) perspective(1500px);
    animation:orbitSpin 50s linear infinite, ringFloat 8s ease-in-out infinite;
    box-shadow:
        0 0 50px rgba(34,211,238,0.15) inset,
        0 0 70px rgba(34,211,238,0.1),
        inset -60px -60px 120px rgba(34,211,238,0.05);
}
@keyframes orbitSpin{
    from{transform:rotateX(70deg) rotateZ(0deg) perspective(1500px)}
    to{transform:rotateX(70deg) rotateZ(360deg) perspective(1500px)}
}
@keyframes ringFloat{
    0%, 100% { transform: translateY(0) rotateX(70deg) rotateZ(0deg) perspective(1500px); }
    50% { transform: translateY(-20px) rotateX(70deg) rotateZ(180deg) perspective(1500px); }
}

/* Gradient nebula orbs - Enhanced */
.nebula{
    position:fixed;
    border-radius:50%;
    filter:blur(100px) brightness(1.2);
    pointer-events:none;
    z-index:1;
    animation:nebulaFloat 25s ease-in-out infinite;
    box-shadow: 0 0 200px currentColor;
}
.nb1{
    width:600px;height:600px;top:-10%;left:-10%;
    background:radial-gradient(circle at 30% 30%, rgba(0,255,163,0.25) 0%, rgba(0,255,163,0.08) 40%, transparent 70%);
    animation-delay:0s;
    filter: blur(120px) brightness(1.3) drop-shadow(0 0 80px rgba(0,255,163,0.2));
}
.nb2{
    width:700px;height:700px;bottom:-15%;right:-15%;
    background:radial-gradient(circle at 70% 70%, rgba(167,139,250,0.2) 0%, rgba(167,139,250,0.08) 40%, transparent 70%);
    animation-delay:-8s;
    filter: blur(120px) brightness(1.2) drop-shadow(0 0 100px rgba(167,139,250,0.15));
}
.nb3{
    width:400px;height:400px;top:40%;left:40%;
    background:radial-gradient(circle at 50% 50%, rgba(59,130,246,0.2) 0%, rgba(59,130,246,0.05) 40%, transparent 70%);
    animation-delay:-15s;
    filter: blur(100px) brightness(1.1) drop-shadow(0 0 80px rgba(59,130,246,0.15));
}
@keyframes nebulaFloat{
    0%,100%{transform:translate(0,0) scale(1) rotateZ(0deg)}
    25%{transform:translate(60px,-60px) scale(1.15) rotateZ(45deg)}
    50%{transform:translate(0,0) scale(1) rotateZ(90deg)}
    75%{transform:translate(-60px,60px) scale(1.1) rotateZ(135deg)}
}

/* Cosmic dust particles */
.cosmic-dust{
    position:fixed;
    top:0;left:0;
    width:100%;height:100%;
    pointer-events:none;
    z-index:1;
    overflow:hidden;
}
.dust-particle{
    position:absolute;
    background:radial-gradient(circle, rgba(0,255,163,0.4), transparent 70%);
    border-radius:50%;
    opacity:0;
    animation:dustFloat 20s infinite linear;
}
@keyframes dustFloat{
    0%{
        opacity:0;
        transform: translate(0, 0) scale(1);
    }
    10%{
        opacity:0.4;
    }
    90%{
        opacity:0.2;
    }
    100%{
        opacity:0;
        transform: translate(var(--tx), -100vh) scale(0.3) rotateZ(360deg);
    }
}

/* Scan beam - Enhanced */
.scan-beam{
    position:fixed;
    top:0;left:-100%;
    width:4px;height:100%;
    background:linear-gradient(to bottom,
        transparent 0%,
        rgba(0,255,163,0.2) 10%,
        rgba(0,255,163,0.6) 30%,
        rgba(0,255,163,1) 50%,
        rgba(0,255,163,0.6) 70%,
        rgba(0,255,163,0.2) 90%,
        transparent 100%);
    z-index:2;
    pointer-events:none;
    animation:scanBeam 12s linear infinite;
    box-shadow:
        0 0 20px rgba(0,255,163,0.6),
        0 0 40px rgba(0,255,163,0.3),
        inset 0 0 10px rgba(0,255,163,0.4);
    filter: drop-shadow(0 0 15px rgba(0,255,163,0.5));
}
@keyframes scanBeam{
    0%{left:-2%}100%{left:102%}
}

/* Holographic wave effect */
.holo-wave{
    position:fixed;
    top:0;left:0;
    width:100%;height:100%;
    z-index:0.5;
    pointer-events:none;
    overflow:hidden;
}
.wave-line{
    position:absolute;
    width:200%;
    height:1px;
    background:linear-gradient(90deg, transparent 0%, rgba(0,255,163,0.1) 50%, transparent 100%);
    animation: waveMove 8s linear infinite;
}
@keyframes waveMove{
    0% { transform: translateY(0) translateX(0); }
    100% { transform: translateY(100vh) translateX(-50%); }
}

/* HUD corners - Enhanced */
.hud{
    position:fixed;width:30px;height:30px;z-index:3;pointer-events:none;
    opacity:0.8;
}
.hud-tl{
    top:15px;left:15px;
    border-top:2px solid rgba(0,255,163,0.8);
    border-left:2px solid rgba(0,255,163,0.8);
    box-shadow: 0 0 15px rgba(0,255,163,0.6), inset 0 0 10px rgba(0,255,163,0.3);
    animation: hudPulse 2s ease-in-out infinite;
}
.hud-tr{
    top:15px;right:15px;
    border-top:2px solid rgba(0,255,163,0.8);
    border-right:2px solid rgba(0,255,163,0.8);
    box-shadow: 0 0 15px rgba(0,255,163,0.6), inset 0 0 10px rgba(0,255,163,0.3);
    animation: hudPulse 2s ease-in-out infinite 0.5s;
}
.hud-bl{
    bottom:85px;left:15px;
    border-bottom:2px solid rgba(0,255,163,0.8);
    border-left:2px solid rgba(0,255,163,0.8);
    box-shadow: 0 0 15px rgba(0,255,163,0.6), inset 0 0 10px rgba(0,255,163,0.3);
    animation: hudPulse 2s ease-in-out infinite 1s;
}
.hud-br{
    bottom:85px;right:15px;
    border-bottom:2px solid rgba(0,255,163,0.8);
    border-right:2px solid rgba(0,255,163,0.8);
    box-shadow: 0 0 15px rgba(0,255,163,0.6), inset 0 0 10px rgba(0,255,163,0.3);
    animation: hudPulse 2s ease-in-out infinite 1.5s;
}
@keyframes hudPulse{
    0%, 100% { opacity: 0.6; box-shadow: 0 0 15px rgba(0,255,163,0.6), inset 0 0 10px rgba(0,255,163,0.3); }
    50% { opacity: 1; box-shadow: 0 0 25px rgba(0,255,163,0.9), inset 0 0 15px rgba(0,255,163,0.5); }
}

/* Floating particles - Enhanced */
.particles{position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:2}
.particle{
    position:absolute;width:3px;height:3px;
    background:radial-gradient(circle, rgba(0,255,163,0.8), rgba(0,255,163,0.2));
    border-radius:50%;opacity:0;
    animation:floatUp 15s infinite;
    box-shadow:0 0 12px rgba(0,255,163,0.6);
}
@keyframes floatUp{
    0%{
        transform:translateY(100vh) translateX(0) rotateZ(0deg);
        opacity:0;
    }
    10%{opacity:0.6}
    90%{opacity:0.3}
    100%{
        transform:translateY(-20vh) translateX(100px) rotateZ(360deg);
        opacity:0;
    }
}

/* 3D depth effect overlay */
body::after {
    content: '';
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: 
        radial-gradient(ellipse at center top, 
            rgba(0,255,163,0.03) 0%, 
            transparent 50%),
        radial-gradient(ellipse at center bottom,
            rgba(34,211,238,0.02) 0%,
            transparent 50%);
    pointer-events: none;
    z-index: 0.5;
    mix-blend-mode: overlay;
}

        /* ── HEART CONTAINER ── */
        .heart-container{
            position:absolute;
            top:48%;left:50%;
            transform:translate(-50%,-50%);
            display:flex;
            gap:50px;
            z-index:100;
            perspective:2000px;
            width:100%;
            max-width:960px;
            justify-content:center;
            align-items:center;
            padding:0 20px;
        }

        .heart-link{
            position:relative;
            text-align:center;
            text-decoration:none;
            transition:.6s cubic-bezier(.23,1,.32,1);
            transform-style:preserve-3d;
            filter:drop-shadow(0 10px 30px rgba(0,0,0,0.6));
            flex:0 0 auto;
        }
        .heart-link::before{
            content:'';position:absolute;
            top:50%;left:50%;
            transform:translate(-50%,-50%) translateZ(-20px);
            width:280px;height:280px;
            border-radius:50%;
            background:radial-gradient(circle,transparent 40%,currentColor 40%,currentColor 42%,transparent 42%);
            opacity:0.2;
            animation:pulse 3s ease-in-out infinite;
            pointer-events:none;
        }
        @keyframes pulse{
            0%,100%{transform:translate(-50%,-50%) translateZ(-20px) scale(1);opacity:0.2}
            50%{transform:translate(-50%,-50%) translateZ(-20px) scale(1.15);opacity:0.4}
        }
        .heart-link:hover{
            transform:translateY(-18px) rotateX(10deg) scale(1.06);
            filter:drop-shadow(0 25px 60px rgba(0,255,163,0.5));
        }
        .heart-link:hover .heart-visual{
            filter:brightness(1.3) saturate(1.4);
            transform:translateZ(80px) rotateZ(-5deg);
        }
        .heart-visual{
            position:relative;
            width:220px;height:220px;
            margin-bottom:14px;
            background-size:cover;
            background-position:center;
            -webkit-mask-image:url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>');
            mask-image:url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>');
            -webkit-mask-size:contain;mask-size:contain;
            transition:.6s cubic-bezier(.23,1,.32,1);
            transform:translateZ(50px);
            border-radius:20px;
        }
        .heart-old{background-image:url('images/old/image-035.png');color:var(--heart-red)}
        .heart-feb{background-image:url('images/2026-02/image-018.jpg');color:var(--accent)}
        .heart-mar{background-image:url('images/2026-03/image-013.jpg');color:var(--cyan)}
        .heart-apr{background-image:url('images/2026-04/image-18.jpg');color:var(--blue)}
        .heart-may{background-image:url('images/2026-05/image-01.jpeg');color:var(--blue)}

        .heart-label{
            font-family:'Space Mono',monospace;
            font-size:10px;
            font-weight:700;
            letter-spacing:3px;
            text-transform:uppercase;
            position:relative;
            padding:8px 16px;
            background:rgba(255,255,255,0.04);
            border-radius:20px;
            backdrop-filter:blur(10px);
            border:1px solid currentColor;
            transition:0.4s;
            transform:translateZ(30px);
        }
        .heart-link:hover .heart-label{
            background:rgba(255,255,255,0.1);
            box-shadow:0 0 20px currentColor;
        }

        /* ── MAIN TITLE ── */
        .main-title{
            position:absolute;
            top:50%;left:50%;
            transform:translate(-50%,-50%);
            text-align:center;
            pointer-events:none;
            z-index:10;width:100%;
        }
        .main-title h1{
            font-family:'Bebas Neue',sans-serif;
            font-size:clamp(4rem,12vw,8rem);
            letter-spacing:4px;
            background:linear-gradient(135deg,rgba(0,255,163,0.08),rgba(167,139,250,0.08),rgba(59,130,246,0.06));
            -webkit-background-clip:text;background-clip:text;
            -webkit-text-fill-color:transparent;
            white-space:nowrap;
            animation:titleGlow 4s ease-in-out infinite;
        }
        @keyframes titleGlow{
            0%,100%{opacity:0.07;filter:blur(3px)}
            50%{opacity:0.15;filter:blur(0)}
        }

        /* ── BOTTOM SHELF ── */
        .bottom-shelf{
            position:fixed;bottom:0;width:100%;
            height:70px;
            background:linear-gradient(to right,rgba(0,0,0,0.9),rgba(2,6,23,0.95),rgba(0,0,0,0.9));
            overflow:hidden;
            border-top:1px solid rgba(0,255,163,0.25);
            z-index:50;
            display:flex;align-items:center;
        }
        .text-track{
            display:flex;width:max-content;
            animation:slideText 15s linear infinite;
            white-space:nowrap;
        }
        .lisa-text{
            font-family:'Bebas Neue',sans-serif;
            font-size:clamp(32px,6vw,50px);
            font-weight:900;
            margin:0 30px;color:#fff;
            text-transform:uppercase;
            font-style:italic;
            letter-spacing:5px;
            text-shadow:0 0 10px var(--accent),0 0 20px var(--accent);
            animation:flash 1.5s infinite alternate;
        }
        @keyframes slideText{from{transform:translateX(0)}to{transform:translateX(-50%)}}
        @keyframes flash{
            0%,100%{color:#fff;text-shadow:0 0 10px var(--accent),0 0 20px var(--accent),0 0 40px var(--purple);filter:brightness(1)}
            33%{color:var(--accent);text-shadow:0 0 20px #fff,0 0 30px var(--blue);filter:brightness(1.5) skewX(-2deg)}
            66%{color:var(--purple);text-shadow:0 0 20px var(--accent),0 0 40px #ff00de;filter:brightness(1.2) skewX(2deg)}
        }

        /* ── MUSIC PLAYER ── */
        #p-cont{
            position:fixed;
            bottom:140px;right:16px;
            width:260px;
            background:linear-gradient(135deg,rgba(2,6,23,0.97),rgba(15,23,42,0.95));
            backdrop-filter:blur(30px);
            border:1px solid rgba(0,255,163,0.3);
            border-radius:24px;
            z-index:10000;padding:16px;
            box-shadow:0 25px 60px rgba(0,0,0,0.7),0 0 40px rgba(0,255,163,0.05);
            touch-action:none;cursor:grab;
            transition:transform 0.3s;
        }
        #p-cont:active{cursor:grabbing}
        .p-header{display:flex;align-items:center;gap:8px;margin-bottom:12px}
        .eq{display:flex;align-items:flex-end;gap:2px;height:14px;padding:4px;background:rgba(0,255,163,0.1);border-radius:8px}
        .eq span{width:3px;background:linear-gradient(to top,var(--accent),var(--purple));border-radius:2px;animation:eq .8s infinite alternate}
        .eq span:nth-child(2){animation-delay:.2s}
        .eq span:nth-child(3){animation-delay:.4s}
        @keyframes eq{0%{height:4px}100%{height:14px}}
        .paused .eq span{animation-play-state:paused;height:4px}
        #t-name{font-size:11px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1;color:var(--accent);font-family:'Space Mono',monospace}
        .ctrls{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
        .ctrls button{
            background:rgba(255,255,255,0.04);
            border:1px solid rgba(255,255,255,.12);
            color:white;height:36px;border-radius:10px;
            font-size:11px;cursor:pointer;transition:0.3s;
            font-family:'Space Mono',monospace;
        }
        .ctrls button:hover{background:var(--accent);color:black;border-color:var(--accent)}
        .s-list{max-height:80px;overflow-y:auto;font-size:10px;background:rgba(0,0,0,.3);border-radius:10px;padding:6px}
        .s-item{padding:7px;cursor:pointer;opacity:.5;border-radius:6px;transition:0.3s;font-family:'Space Mono',monospace}
        .s-item:hover{opacity:0.8;background:rgba(255,255,255,0.05)}
        .s-item.active{opacity:1;background:rgba(0,255,163,.15);color:var(--accent)}

/* ── RESPONSIVE ── */

/* 0. 극소형 모바일 (320px ~ 374px) */
@media(max-width: 374px) {
    .heart-container {
        flex-direction: column;
        gap: 12px;
        top: 40%;
        padding: 0 10px;
    }
    .heart-visual {
        width: 100px !important;
        height: 100px !important;
        margin-bottom: 8px;
    }
    .heart-link::before {
        width: 120px !important;
        height: 120px !important;
    }
    .heart-label {
        font-size: 8px;
        padding: 4px 10px;
        letter-spacing: 1px;
    }
    .main-title h1 {
        font-size: clamp(2.2rem, 8vw, 3.5rem);
        letter-spacing: 2px;
    }
    .ring-1 { width: 200px; height: 200px; margin: -100px 0 0 -100px; }
    .ring-2 { width: 300px; height: 300px; margin: -150px 0 0 -150px; }
    .ring-3 { width: 400px; height: 400px; margin: -200px 0 0 -200px; }
    
    #p-cont {
        width: calc(100vw - 20px);
        right: 10px;
        left: 10px;
        bottom: 120px;
        padding: 12px;
    }
    .p-header { margin-bottom: 8px; }
    .ctrls { gap: 6px; margin-bottom: 8px; }
    .ctrls button { height: 32px; font-size: 10px; }
    .s-list { max-height: 60px; font-size: 9px; }
    
    .hud { width: 24px; height: 24px; }
    .hud-tl, .hud-tr { top: 10px; }
    .hud-bl, .hud-br { bottom: 75px; }
    
    .lisa-text { font-size: 24px; margin: 0 20px; }
    .bottom-shelf { height: 60px; }
    
    #musicToggle { width: 40px; height: 40px; bottom: 80px; }
    #musicToggle svg { width: 20px; height: 20px; }
}

/* 1. 소형 모바일 (375px ~ 479px) */
@media(min-width: 375px) and (max-width: 479px) {
    .heart-container {
        flex-direction: column;
        gap: 14px;
        top: 41%;
        padding: 0 12px;
    }
    .heart-visual {
        width: 120px !important;
        height: 120px !important;
        margin-bottom: 8px;
    }
    .heart-link::before {
        width: 140px !important;
        height: 140px !important;
    }
    .heart-label {
        font-size: 8px;
        padding: 4px 10px;
        letter-spacing: 1.5px;
    }
    .main-title h1 {
        font-size: clamp(2.5rem, 9vw, 4rem);
        letter-spacing: 2px;
    }

<script>
/* ── [1] 4D CANVAS: fluid connected dots ── */
(function(){
    const canvas = document.getElementById('bg-canvas');
    if(!canvas) return;
    const ctx = canvas.getContext('2d');
    let W, H, pts = [];
    const COUNT = window.innerWidth < 768 ? 40 : 70;
    const CONNECT_DIST = window.innerWidth < 768 ? 120 : 160;

    function resize(){
        W = canvas.width = window.innerWidth;
        H = canvas.height = window.innerHeight;
    }

    function initPts(){
        pts = [];
        for(let i=0;i<COUNT;i++){
            pts.push({
                x:Math.random()*W, y:Math.random()*H,
                vx:(Math.random()-.5)*0.4,
                vy:(Math.random()-.5)*0.4,
                r:Math.random()*1.5+0.5,
                depth:Math.random()
            });
        }
    }

    let mx=window.innerWidth/2, my=window.innerHeight/2;
    window.addEventListener('mousemove',e=>{mx=e.clientX;my=e.clientY});
    window.addEventListener('touchmove',e=>{mx=e.touches[0].clientX;my=e.touches[0].clientY},{passive:true});

    function draw(){
        ctx.clearRect(0,0,W,H);
        pts.forEach(p=>{
            const dx=p.x-mx, dy=p.y-my;
            const d=Math.sqrt(dx*dx+dy*dy);
            if(d<100){
                p.vx += dx/d*0.3;
                p.vy += dy/d*0.3;
            }
            p.vx *= 0.99; p.vy *= 0.99;
            p.x+=p.vx; p.y+=p.vy;
            if(p.x<0||p.x>W) p.vx*=-1;
            if(p.y<0||p.y>H) p.vy*=-1;
            const alpha = 0.2 + p.depth*0.4;
            ctx.beginPath();
            ctx.arc(p.x,p.y,p.r,0,Math.PI*2);
            ctx.fillStyle=`rgba(0,255,163,${alpha})`;
            ctx.fill();
        });
        for(let i=0;i<pts.length;i++){
            for(let j=i+1;j<pts.length;j++){
                const dx=pts[i].x-pts[j].x, dy=pts[i].y-pts[j].y;
                const d=Math.sqrt(dx*dx+dy*dy);
                if(d<CONNECT_DIST){
                    const alpha=(1-d/CONNECT_DIST)*0.15;
                    ctx.beginPath();
                    ctx.moveTo(pts[i].x,pts[i].y);
                    ctx.lineTo(pts[j].x,pts[j].y);
                    ctx.strokeStyle=`rgba(0,255,163,${alpha})`;
                    ctx.lineWidth=0.5;
                    ctx.stroke();
                }
            }
        }
        requestAnimationFrame(draw);
    }
    window.addEventListener('resize',()=>{resize();initPts()});
    resize(); initPts(); draw();
})();

/* ── [2] MUSIC PLAYER & AUTO PLAY LOGIC (통합본) ── */
/* ── [2] MUSIC PLAYER: 공격적 자동 재생 모드 ── */
const audio = document.getElementById('audio');
const pBtn = document.getElementById('p-btn');
const tName = document.getElementById('t-name');
const plEl = document.getElementById('pl');
const pCont = document.getElementById('p-cont');
const musicToggle = document.getElementById('musicToggle');
const speakerIcon = document.getElementById('speakerIcon');

const tracks = (typeof EXTERNAL_TRACKS !== 'undefined' && EXTERNAL_TRACKS.length > 0) 
               ? EXTERNAL_TRACKS 
               : ["Ega.mp3"];
let cIdx = 0;

function initP() {
    if (typeof tracks !== 'undefined' && tracks.length > 0) {
        plEl.innerHTML = tracks.map((t, i) => 
            `<div class="s-item ${i === cIdx ? 'active' : ''}" onclick="loadT(${i})">
                ${t.replace('.mp3', '').replace(/_/g, ' ')}
            </div>`
        ).join('');
        
        // 페이지 로드 즉시 실행 시도
        loadT(0, true); 
    }
}

function loadT(idx, auto = true) {
    if (!tracks.length) return;
    cIdx = idx;
    audio.src = `music/${tracks[idx]}`;
    tName.innerText = tracks[idx].replace('.mp3', '').replace(/_/g, ' ');
    document.querySelectorAll('.s-item').forEach((it, i) => it.classList.toggle('active', i === idx));
    
    if (auto) {
        // [필살기] 브라우저가 차단하지 못하도록 일단 음소거(muted)로 재생 시작
        audio.muted = true;
        audio.play().then(() => {
            updUI(true);
            
            // 사용자가 화면에서 하는 모든 사소한 액션(마우스 이동, 클릭, 터치 등)에 반응
            const forceUnmute = () => {
                audio.muted = false;
                // 일부 브라우저는 muted=false 시점에 일시정지되므로 다시 play
                audio.play(); 
                updUI(true);
                
                // 이벤트 모두 제거
                ['click', 'touchstart', 'mousemove', 'keydown'].forEach(evt => 
                    window.removeEventListener(evt, forceUnmute)
                );
            };

            ['click', 'touchstart', 'mousemove', 'keydown'].forEach(evt => 
                window.addEventListener(evt, forceUnmute, { once: false })
            );
            
        }).catch(e => {
            // 음소거 재생조차 막힌 극단적인 경우 (거의 없음)
            const playOnFirstInteraction = () => {
                audio.muted = false;
                audio.play().then(() => updUI(true));
                window.removeEventListener('mousedown', playOnFirstInteraction);
            };
            window.addEventListener('mousedown', playOnFirstInteraction);
        });
    } else {
        updUI(false);
    }
}

function toggleP() {
    audio.muted = false; 
    if (audio.paused) {
        audio.play().then(() => updUI(true));
    } else {
        audio.pause();
        updUI(false);
    }
}

function updUI(p) {
    pCont.classList.toggle('paused', !p);
    if(pBtn) pBtn.innerText = p ? "PAUSE" : "PLAY";
    if(musicToggle) {
        if(p) {
            musicToggle.classList.add('playing');
            if(speakerIcon) speakerIcon.style.fill = "#00FFF0";
        } else {
            musicToggle.classList.remove('playing');
            if(speakerIcon) speakerIcon.style.fill = "#ffffff";
        }
    }
}

function nextT() { audio.muted = false; cIdx = (cIdx + 1) % tracks.length; loadT(cIdx); }
function prevT() { audio.muted = false; cIdx = (cIdx - 1 + tracks.length) % tracks.length; loadT(cIdx); }

audio.onended = nextT;
if(musicToggle) musicToggle.addEventListener('click', (e) => { e.stopPropagation(); toggleP(); });

// 초기 볼륨 설정
audio.volume = 0.5;



/* ── [3] DRAG & UI INTERACTION ── */
let isDrag=false,sX,sY,iX,iY;
const sD=(e)=>{
    if(e.target.closest('button')||e.target.closest('.s-list'))return;
    isDrag=true;
    const cX=e.type==='touchstart'?e.touches[0].clientX:e.clientX;
    const cY=e.type==='touchstart'?e.touches[0].clientY:e.clientY;
    const r=pCont.getBoundingClientRect();
    sX=cX;sY=cY;iX=r.left;iY=r.top;
};
const oD=(e)=>{
    if(!isDrag)return;
    const cX=e.type==='touchmove'?e.touches[0].clientX:e.clientX;
    const cY=e.type==='touchmove'?e.touches[0].clientY:e.clientY;
    pCont.style.left=`${iX+(cX-sX)}px`;
    pCont.style.top=`${iY+(cY-sY)}px`;
    pCont.style.right='auto';pCont.style.bottom='auto';
};
const eD=()=>{isDrag=false};
pCont.addEventListener('mousedown',sD);
pCont.addEventListener('touchstart',sD,{passive:false});
window.addEventListener('mousemove',oD);
window.addEventListener('touchmove',oD,{passive:false});
window.addEventListener('mouseup',eD);
window.addEventListener('touchend',eD);

/* ── [4] PARTICLES & DUST ── */
function createParticles(){
    const container=document.getElementById('particles');
    if(!container) return;
    const n = window.innerWidth < 768 ? 20 : 35;
    for(let i=0;i<n;i++){
        const p=document.createElement('div');
        p.className='particle';
        p.style.left=Math.random()*100+'%';
        p.style.animationDelay=Math.random()*15+'s';
        p.style.animationDuration=(10+Math.random()*10)+'s';
        container.appendChild(p);
    }
}

(function(){
    const container = document.getElementById('cosmic-dust');
    if(!container) return;
    for(let i = 0; i < 50; i++){
        const particle = document.createElement('div');
        particle.className = 'dust-particle';
        const size = Math.random() * 80 + 20;
        const x = Math.random() * 100;
        const delay = Math.random() * 20;
        const duration = Math.random() * 15 + 15;
        const tx = (Math.random() - 0.5) * 300;
        particle.style.width = size + 'px';
        particle.style.height = size + 'px';
        particle.style.left = x + 'vw';
        particle.style.top = '100vh';
        particle.style.setProperty('--tx', tx + 'px');
        particle.style.animationDelay = delay + 's';
        particle.style.animationDuration = duration + 's';
        container.appendChild(particle);
    }
})();

/* ── [5] PARALLAX ── */
(function(){
    const rings = document.querySelectorAll('.orbit-ring');
    const nebulas = document.querySelectorAll('.nebula');
    let tx=0,ty=0,cx=0,cy=0;
    function apply(){
        cx += (tx-cx)*0.05;
        cy += (ty-cy)*0.05;
        rings.forEach((r,i)=>{
            const s=(i+1)*0.3;
            r.style.transform=`rotateX(70deg) rotateZ(${cx*s}deg) translateY(${cy*s*2}px)`;
        });
        nebulas.forEach((n,i)=>{
            n.style.transform=`translate(${cx*(i+1)*5}px,${cy*(i+1)*5}px) scale(1)`;
        });
        requestAnimationFrame(apply);
    }
    window.addEventListener('mousemove',e=>{
        tx=(e.clientX/window.innerWidth-.5)*20;
        ty=(e.clientY/window.innerHeight-.5)*10;
    });
    apply();
})();

window.onload = () => {
    createParticles();
    initP();

    // 모바일/iOS 대응 자동재생
    const unlockAudio = async () => {
        try {
            audio.muted = true;
            await audio.play();

            setTimeout(() => {
                audio.muted = false;
            }, 300);

            updUI(true);

            window.removeEventListener('touchstart', unlockAudio);
            window.removeEventListener('click', unlockAudio);

        } catch(e) {
            console.log(e);
        }
    };

    window.addEventListener('touchstart', unlockAudio, { once:true });
    window.addEventListener('click', unlockAudio, { once:true });
};


</script>
