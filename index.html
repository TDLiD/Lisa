<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
    <title>2026 Future Hub</title>
    <script src="music/music_list.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Syne:wght@800;900&family=Space+Mono:wght@700&display=swap" rel="stylesheet">
    <link rel="icon" href="data:;base64,iVBORw0KGgo=">
    <style>
        /* ── DAY-BASED THEME VARIABLES ── */
        /* Default (Mon) */
        :root {
            --accent: #00ffa3;
            --accent2: #a78bfa;
            --accent3: #22d3ee;
            --heart-red: #ff4d6d;
            --purple: #a78bfa;
            --blue: #3b82f6;
            --cyan: #22d3ee;
            --bg: #020205;
            --glass: rgba(15,23,42,0.8);
            --grid-color: rgba(0,255,163,0.08);
            --ring1-color: rgba(0,255,163,0.3);
            --ring2-color: rgba(167,139,250,0.25);
            --ring3-color: rgba(34,211,238,0.2);
            --nb1-color: rgba(0,255,163,0.25);
            --nb2-color: rgba(167,139,250,0.2);
            --particle-color: rgba(0,255,163,0.8);
            --scan-color: rgba(0,255,163,1);
            --day-label: "MONDAY";
        }
        /* Sunday */
        body.day-0 {
            --accent: #ff6b9d;
            --accent2: #ff9de2;
            --accent3: #ffb347;
            --bg: #0a0205;
            --grid-color: rgba(255,107,157,0.08);
            --ring1-color: rgba(255,107,157,0.3);
            --ring2-color: rgba(255,179,71,0.25);
            --ring3-color: rgba(255,157,226,0.2);
            --nb1-color: rgba(255,107,157,0.25);
            --nb2-color: rgba(255,179,71,0.2);
            --particle-color: rgba(255,107,157,0.8);
            --scan-color: rgba(255,107,157,1);
        }
        /* Monday */
        body.day-1 {
            --accent: #00ffa3;
            --accent2: #a78bfa;
            --accent3: #22d3ee;
            --bg: #020205;
            --grid-color: rgba(0,255,163,0.08);
            --ring1-color: rgba(0,255,163,0.3);
            --ring2-color: rgba(167,139,250,0.25);
            --ring3-color: rgba(34,211,238,0.2);
            --nb1-color: rgba(0,255,163,0.25);
            --nb2-color: rgba(167,139,250,0.2);
            --particle-color: rgba(0,255,163,0.8);
            --scan-color: rgba(0,255,163,1);
        }
        /* Tuesday */
        body.day-2 {
            --accent: #f97316;
            --accent2: #fb923c;
            --accent3: #fbbf24;
            --bg: #050200;
            --grid-color: rgba(249,115,22,0.08);
            --ring1-color: rgba(249,115,22,0.3);
            --ring2-color: rgba(251,146,60,0.25);
            --ring3-color: rgba(251,191,36,0.2);
            --nb1-color: rgba(249,115,22,0.25);
            --nb2-color: rgba(251,191,36,0.2);
            --particle-color: rgba(249,115,22,0.8);
            --scan-color: rgba(249,115,22,1);
        }
        /* Wednesday */
        body.day-3 {
            --accent: #06b6d4;
            --accent2: #0ea5e9;
            --accent3: #6366f1;
            --bg: #000508;
            --grid-color: rgba(6,182,212,0.08);
            --ring1-color: rgba(6,182,212,0.3);
            --ring2-color: rgba(14,165,233,0.25);
            --ring3-color: rgba(99,102,241,0.2);
            --nb1-color: rgba(6,182,212,0.25);
            --nb2-color: rgba(99,102,241,0.2);
            --particle-color: rgba(6,182,212,0.8);
            --scan-color: rgba(6,182,212,1);
        }
        /* Thursday */
        body.day-4 {
            --accent: #a78bfa;
            --accent2: #c084fc;
            --accent3: #e879f9;
            --bg: #030008;
            --grid-color: rgba(167,139,250,0.08);
            --ring1-color: rgba(167,139,250,0.3);
            --ring2-color: rgba(192,132,252,0.25);
            --ring3-color: rgba(232,121,249,0.2);
            --nb1-color: rgba(167,139,250,0.25);
            --nb2-color: rgba(232,121,249,0.2);
            --particle-color: rgba(167,139,250,0.8);
            --scan-color: rgba(167,139,250,1);
        }
        /* Friday */
        body.day-5 {
            --accent: #facc15;
            --accent2: #f59e0b;
            --accent3: #84cc16;
            --bg: #050500;
            --grid-color: rgba(250,204,21,0.08);
            --ring1-color: rgba(250,204,21,0.3);
            --ring2-color: rgba(245,158,11,0.25);
            --ring3-color: rgba(132,204,22,0.2);
            --nb1-color: rgba(250,204,21,0.25);
            --nb2-color: rgba(132,204,22,0.2);
            --particle-color: rgba(250,204,21,0.8);
            --scan-color: rgba(250,204,21,1);
        }
        /* Saturday */
        body.day-6 {
            --accent: #34d399;
            --accent2: #10b981;
            --accent3: #059669;
            --bg: #000503;
            --grid-color: rgba(52,211,153,0.08);
            --ring1-color: rgba(52,211,153,0.3);
            --ring2-color: rgba(16,185,129,0.25);
            --ring3-color: rgba(5,150,105,0.2);
            --nb1-color: rgba(52,211,153,0.25);
            --nb2-color: rgba(5,150,105,0.2);
            --particle-color: rgba(52,211,153,0.8);
            --scan-color: rgba(52,211,153,1);
        }

        *{margin:0;padding:0;box-sizing:border-box}

        body{
            margin:0;
            background:var(--bg);
            color:white;
            font-family:'Syne',sans-serif;
            overflow:hidden;
            height:100dvh;
            position:relative;
            perspective:1200px;
            transition: background 1s ease;
        }

        /* ── DAY BADGE ── */
        .day-badge {
            position: fixed;
            top: 14px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 200;
            font-family: 'Space Mono', monospace;
            font-size: 9px;
            letter-spacing: 4px;
            text-transform: uppercase;
            padding: 5px 18px;
            border: 1px solid var(--accent);
            border-radius: 20px;
            color: var(--accent);
            background: rgba(0,0,0,0.4);
            backdrop-filter: blur(10px);
            pointer-events: none;
            text-shadow: 0 0 10px var(--accent);
            box-shadow: 0 0 15px rgba(0,0,0,0.5), inset 0 0 8px rgba(255,255,255,0.03);
            white-space: nowrap;
        }

        /* ── 4D BG CANVAS ── */
        #bg-canvas{
            position:fixed;top:0;left:0;
            width:100%;height:100%;
            z-index:0;pointer-events:none;
            filter: brightness(1.1) contrast(1.1);
        }

        .grid-floor{
            position:fixed;
            bottom:0;left:50%;
            width:200%;height:60%;
            background:
                linear-gradient(var(--grid-color) 1px,transparent 1px),
                linear-gradient(90deg,var(--grid-color) 1px,transparent 1px);
            background-size:60px 60px, 60px 60px;
            transform-origin:bottom center;
            transform:translateX(-50%) rotateX(75deg) perspective(1200px);
            z-index:1;pointer-events:none;
            animation:gridPulse 8s ease-in-out infinite, gridShift 20s ease-in-out infinite;
        }
        @keyframes gridPulse{0%,100%{opacity:0.3}50%{opacity:0.7}}
        @keyframes gridShift{
            0%,100%{background-position:0 0,0 0}
            50%{background-position:30px 30px,30px 30px}
        }

        .orbit-ring{
            position:fixed;border-radius:50%;border:1px solid;
            pointer-events:none;z-index:1;top:50%;left:50%;
            transform-origin:center center;
            filter: drop-shadow(0 0 15px currentColor);
        }
        .ring-1{
            width:500px;height:500px;margin:-250px 0 0 -250px;
            border-color:var(--ring1-color);
            animation:orbitSpin 20s linear infinite;
        }
        .ring-2{
            width:700px;height:700px;margin:-350px 0 0 -350px;
            border-color:var(--ring2-color);
            animation:orbitSpin 35s linear infinite reverse;
        }
        .ring-3{
            width:900px;height:900px;margin:-450px 0 0 -450px;
            border-color:var(--ring3-color);
            animation:orbitSpin 50s linear infinite;
        }
        @keyframes orbitSpin{
            from{transform:rotateX(70deg) rotateZ(0deg) perspective(1500px)}
            to{transform:rotateX(70deg) rotateZ(360deg) perspective(1500px)}
        }

        .nebula{
            position:fixed;border-radius:50%;
            filter:blur(100px) brightness(1.2);
            pointer-events:none;z-index:1;
            animation:nebulaFloat 25s ease-in-out infinite;
        }
        .nb1{width:600px;height:600px;top:-10%;left:-10%;
            background:radial-gradient(circle at 30% 30%,var(--nb1-color) 0%,transparent 70%);
        }
        .nb2{width:700px;height:700px;bottom:-15%;right:-15%;
            background:radial-gradient(circle at 70% 70%,var(--nb2-color) 0%,transparent 70%);
            animation-delay:-8s;
        }
        .nb3{width:400px;height:400px;top:40%;left:40%;
            background:radial-gradient(circle at 50% 50%,rgba(59,130,246,0.15) 0%,transparent 70%);
            animation-delay:-15s;
        }
        @keyframes nebulaFloat{
            0%,100%{transform:translate(0,0) scale(1)}
            25%{transform:translate(60px,-60px) scale(1.15)}
            50%{transform:translate(0,0) scale(1)}
            75%{transform:translate(-60px,60px) scale(1.1)}
        }

        .scan-beam{
            position:fixed;top:0;left:-100%;
            width:3px;height:100%;
            background:linear-gradient(to bottom,
                transparent 0%,var(--scan-color) 50%,transparent 100%);
            z-index:2;pointer-events:none;
            animation:scanBeam 12s linear infinite;
            box-shadow:0 0 20px var(--accent),0 0 40px var(--accent);
        }
        @keyframes scanBeam{0%{left:-2%}100%{left:102%}}

        .holo-wave{position:fixed;top:0;left:0;width:100%;height:100%;z-index:0;pointer-events:none;overflow:hidden;}
        .wave-line{
            position:absolute;width:200%;height:1px;
            background:linear-gradient(90deg,transparent 0%,var(--grid-color) 50%,transparent 100%);
            animation:waveMove 8s linear infinite;
        }
        @keyframes waveMove{0%{transform:translateY(0) translateX(0)}100%{transform:translateY(100vh) translateX(-50%)}}

        .hud{position:fixed;width:28px;height:28px;z-index:3;pointer-events:none;opacity:0.8;}
        .hud-tl{top:12px;left:12px;border-top:2px solid var(--accent);border-left:2px solid var(--accent);animation:hudPulse 2s ease-in-out infinite;}
        .hud-tr{top:12px;right:12px;border-top:2px solid var(--accent);border-right:2px solid var(--accent);animation:hudPulse 2s ease-in-out infinite 0.5s;}
        .hud-bl{bottom:78px;left:12px;border-bottom:2px solid var(--accent);border-left:2px solid var(--accent);animation:hudPulse 2s ease-in-out infinite 1s;}
        .hud-br{bottom:78px;right:12px;border-bottom:2px solid var(--accent);border-right:2px solid var(--accent);animation:hudPulse 2s ease-in-out infinite 1.5s;}
        @keyframes hudPulse{
            0%,100%{opacity:0.5;box-shadow:0 0 8px var(--accent)}
            50%{opacity:1;box-shadow:0 0 20px var(--accent)}
        }

        .particles{position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:2}
        .particle{
            position:absolute;width:2px;height:2px;
            background:var(--particle-color);
            border-radius:50%;opacity:0;
            animation:floatUp 15s infinite;
            box-shadow:0 0 8px var(--accent);
        }
        @keyframes floatUp{
            0%{transform:translateY(100vh) translateX(0);opacity:0}
            10%{opacity:0.6}90%{opacity:0.3}
            100%{transform:translateY(-20vh) translateX(80px);opacity:0}
        }

        /* ── MAIN TITLE ── */
        .main-title{
            position:fixed;
            top:28px;left:50%;
            transform:translateX(-50%);
            text-align:center;
            pointer-events:none;
            z-index:10;width:100%;
        }
        .main-title h1{
            font-family:'Bebas Neue',sans-serif;
            font-size:clamp(2.5rem,6vw,5rem);
            letter-spacing:6px;
            background:linear-gradient(135deg,var(--accent),var(--accent2),var(--accent3));
            -webkit-background-clip:text;background-clip:text;
            -webkit-text-fill-color:transparent;
            white-space:nowrap;
            animation:titleGlow 4s ease-in-out infinite;
            text-shadow: none;
        }
        @keyframes titleGlow{
            0%,100%{filter:brightness(0.9) drop-shadow(0 0 5px var(--accent))}
            50%{filter:brightness(1.2) drop-shadow(0 0 15px var(--accent))}
        }

        /* ── HEART GRID CONTAINER ── */
        .heart-grid {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 100;
            display: grid;
            /* 4 cols on desktop, fewer on mobile */
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
            padding: 10px;
            width: min(92vw, 780px);
            perspective: 2000px;
            /* vertical centering accounts for title & shelf */
            margin-top: 10px;
        }

        .heart-link {
            position: relative;
            text-align: center;
            text-decoration: none;
            display: flex;
            flex-direction: column;
            align-items: center;
            transition: .5s cubic-bezier(.23,1,.32,1);
            transform-style: preserve-3d;
            filter: drop-shadow(0 6px 16px rgba(0,0,0,0.6));
        }
        .heart-link:hover {
            transform: translateY(-10px) rotateX(8deg) scale(1.06);
            filter: drop-shadow(0 18px 40px var(--accent));
        }
        .heart-link:hover .heart-visual {
            filter: brightness(1.3) saturate(1.4);
            transform: translateZ(50px) rotateZ(-3deg);
        }

        .heart-visual {
            position: relative;
            /* Responsive size via CSS variable */
            width: var(--heart-sz, 120px);
            height: var(--heart-sz, 120px);
            margin-bottom: 8px;
            background-size: cover;
            background-position: center;
            -webkit-mask-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>');
            mask-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>');
            -webkit-mask-size: contain;
            mask-size: contain;
            -webkit-mask-repeat: no-repeat;
            mask-repeat: no-repeat;
            -webkit-mask-position: center;
            mask-position: center;
            transition: .5s cubic-bezier(.23,1,.32,1);
            transform: translateZ(30px);
            border-radius: 12px;
            flex-shrink: 0;
        }

        /* Pulse ring around each heart */
        .heart-link::before {
            content: '';
            position: absolute;
            top: calc(var(--heart-sz, 120px) * 0.5);
            left: 50%;
            transform: translate(-50%, -50%) translateZ(-10px);
            width: calc(var(--heart-sz, 120px) * 1.2);
            height: calc(var(--heart-sz, 120px) * 1.2);
            border-radius: 50%;
            border: 1px solid var(--accent);
            opacity: 0;
            pointer-events: none;
            animation: heartPulse 3s ease-in-out infinite;
            animation-delay: var(--pulse-delay, 0s);
        }
        @keyframes heartPulse {
            0% { transform: translate(-50%, -50%) scale(0.8); opacity: 0.5; }
            100% { transform: translate(-50%, -50%) scale(1.4); opacity: 0; }
        }

        /* Image assignments */
        .h-old  { background-image: url('images/old/image-035.png'); }
        .h-feb  { background-image: url('images/2026-02/image-018.jpg'); }
        .h-mar  { background-image: url('images/2026-03/image-013.jpg'); }
        .h-apr  { background-image: url('images/2026-04/image-18.jpg'); }
        .h-may  { background-image: url('images/2026-05/image-01.jpeg'); }
        .h-jun  { background-image: url('images/2026-06/image-01.jpeg'); }
        .h-bali  { background-image: url('images/2026-bali/image-36.jpg'); }
        .h-bali  { background-image: url('images/2026-08/image-11.jpeg'); }


        /* Placeholder gradient hearts for future months */
        .h-jul  { background: radial-gradient(135deg at 30% 30%, #f97316, #7c3aed); }
        .h-aug  { background: radial-gradient(135deg at 30% 30%, #0ea5e9, #6366f1); }
        .h-sep  { background: radial-gradient(135deg at 30% 30%, #10b981, #0284c7); }
        .h-oct  { background: radial-gradient(135deg at 30% 30%, #f43f5e, #f97316); }
        .h-nov  { background: radial-gradient(135deg at 30% 30%, #a78bfa, #3b82f6); }
        .h-dec  { background: radial-gradient(135deg at 30% 30%, #facc15, #ef4444); }

        .heart-label {
            font-family: 'Space Mono', monospace;
            font-size: 9px;
            font-weight: 700;
            letter-spacing: 2px;
            text-transform: uppercase;
            padding: 5px 10px;
            background: rgba(255,255,255,0.04);
            border-radius: 16px;
            backdrop-filter: blur(10px);
            border: 1px solid currentColor;
            transition: 0.4s;
            transform: translateZ(20px);
            white-space: nowrap;
            line-height: 1;
        }
        .heart-link:hover .heart-label {
            background: rgba(255,255,255,0.1);
            box-shadow: 0 0 16px currentColor;
        }

        /* "Coming Soon" overlay for future months */
        .heart-link.future .heart-visual::after {
            content: 'SOON';
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Space Mono', monospace;
            font-size: 10px;
            color: rgba(255,255,255,0.5);
            letter-spacing: 2px;
            background: rgba(0,0,0,0.4);
        }
        .heart-link.future {
            opacity: 0.55;
            pointer-events: none;
            filter: grayscale(0.4) drop-shadow(0 4px 10px rgba(0,0,0,0.4));
        }

        /* 3D card depth - alternating tilt */
        .heart-link:nth-child(odd)  { transform: rotateY(-2deg) rotateX(2deg); }
        .heart-link:nth-child(even) { transform: rotateY(2deg) rotateX(-2deg); }
        .heart-link:nth-child(odd):hover  { transform: translateY(-10px) rotateX(8deg) scale(1.06) rotateY(-2deg); }
        .heart-link:nth-child(even):hover { transform: translateY(-10px) rotateX(8deg) scale(1.06) rotateY(2deg); }

        /* ── BOTTOM SHELF ── */
        .bottom-shelf{
            position:fixed;bottom:0;width:100%;
            height:66px;
            background:linear-gradient(to right,rgba(0,0,0,0.92),rgba(2,6,23,0.97),rgba(0,0,0,0.92));
            overflow:hidden;
            border-top:1px solid var(--accent);
            z-index:50;
            display:flex;align-items:center;
            box-shadow: 0 -4px 30px rgba(0,0,0,0.6);
        }
        .text-track{
            display:flex;width:max-content;
            animation:slideText 15s linear infinite;
            white-space:nowrap;
        }
        .lisa-text{
            font-family:'Bebas Neue',sans-serif;
            font-size:clamp(28px,5vw,46px);
            font-weight:900;
            margin:0 24px;color:#fff;
            text-transform:uppercase;
            font-style:italic;
            letter-spacing:5px;
            text-shadow:0 0 10px var(--accent),0 0 20px var(--accent);
            animation:flash 1.5s infinite alternate;
        }
        @keyframes slideText{from{transform:translateX(0)}to{transform:translateX(-50%)}}
        @keyframes flash{
            0%,100%{color:#fff;text-shadow:0 0 10px var(--accent),0 0 20px var(--accent)}
            50%{color:var(--accent);text-shadow:0 0 20px #fff,0 0 30px var(--accent2);filter:brightness(1.4)}
        }

        /* ── MUSIC PLAYER ── */
        #p-cont{
            position:fixed;
            bottom:130px;right:14px;
            width:240px;
            background:linear-gradient(135deg,rgba(2,6,23,0.97),rgba(15,23,42,0.95));
            backdrop-filter:blur(30px);
            border:1px solid var(--accent);
            border-radius:20px;
            z-index:10000;padding:14px;
            box-shadow:0 20px 50px rgba(0,0,0,0.7),0 0 30px rgba(0,0,0,0.3);
            touch-action:none;cursor:grab;
            transition:border-color 1s;
        }
        #p-cont:active{cursor:grabbing}
        .p-header{display:flex;align-items:center;gap:8px;margin-bottom:10px}
        .eq{display:flex;align-items:flex-end;gap:2px;height:14px;padding:4px;background:rgba(255,255,255,0.06);border-radius:8px}
        .eq span{width:3px;background:linear-gradient(to top,var(--accent),var(--accent2));border-radius:2px;animation:eq .8s infinite alternate}
        .eq span:nth-child(2){animation-delay:.2s}
        .eq span:nth-child(3){animation-delay:.4s}
        @keyframes eq{0%{height:4px}100%{height:14px}}
        .paused .eq span{animation-play-state:paused;height:4px}
        #t-name{font-size:10px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1;color:var(--accent);font-family:'Space Mono',monospace}
        .ctrls{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:10px}
        .ctrls button{
            background:rgba(255,255,255,0.04);
            border:1px solid rgba(255,255,255,.12);
            color:white;height:32px;border-radius:8px;
            font-size:10px;cursor:pointer;transition:0.3s;
            font-family:'Space Mono',monospace;
        }
        .ctrls button:hover{background:var(--accent);color:black;border-color:var(--accent)}
        .s-list{max-height:72px;overflow-y:auto;font-size:10px;background:rgba(0,0,0,.3);border-radius:8px;padding:5px}
        .s-item{padding:6px;cursor:pointer;opacity:.5;border-radius:5px;transition:0.3s;font-family:'Space Mono',monospace}
        .s-item:hover{opacity:0.8;background:rgba(255,255,255,0.05)}
        .s-item.active{opacity:1;background:rgba(0,0,0,0.2);color:var(--accent)}

        /* ── MUSIC TOGGLE BTN ── */
        .bg-music-btn {
            position: fixed;
            bottom: 80px;
            right: 16px;
            z-index: 9999;
            background: rgba(0,0,0,0.5);
            border: 2px solid var(--accent);
            border-radius: 50%;
            width: 44px;height: 44px;
            cursor: pointer;
            display: flex;align-items:center;justify-content:center;
            transition: border-color 0.5s, box-shadow 0.3s;
        }
        .bg-music-btn:hover { box-shadow: 0 0 20px var(--accent); }
        #speakerIcon{width:22px;height:22px;fill:white;}

        /* ── RESPONSIVE ── */

        /* Desktop 4-col (default above) */

        /* Large mobile / small tablet (481–767px): 4-col smaller */
        @media(max-width:767px){
            .heart-grid {
                grid-template-columns: repeat(4, 1fr);
                gap: 8px;
                --heart-sz: 72px;
                width: min(96vw, 480px);
                margin-top: 5px;
            }
            .heart-label { font-size: 7px; padding: 4px 7px; letter-spacing: 1px; }
            .main-title h1 { font-size: clamp(1.8rem,7vw,3rem); letter-spacing: 4px; }
            .day-badge { font-size: 8px; padding: 4px 12px; }
        }

        /* Small mobile (≤480px): 4-col very compact */
        @media(max-width:480px){
            .heart-grid {
                grid-template-columns: repeat(4, 1fr);
                gap: 6px;
                --heart-sz: 58px;
                width: 96vw;
                margin-top: 2px;
            }
            .heart-label { font-size: 6px; padding: 3px 6px; letter-spacing: 0.5px; }
            .main-title h1 { font-size: clamp(1.5rem,7vw,2.5rem); letter-spacing: 3px; }
            #p-cont { width: calc(100vw - 24px); right: 12px; left: 12px; bottom: 120px; }
        }

        /* Tiny mobile (≤360px) */
        @media(max-width:360px){
            .heart-grid {
                grid-template-columns: repeat(3, 1fr);
                --heart-sz: 70px;
                gap: 8px;
                width: 96vw;
            }
        }

        /* Landscape short (height ≤ 500px) */
        @media(max-height:500px) and (orientation:landscape){
            .heart-grid {
                grid-template-columns: repeat(6, 1fr);
                --heart-sz: 60px;
                gap: 6px;
                width: min(96vw,900px);
                margin-top: 0;
            }
            .main-title h1 { font-size: clamp(1.2rem,4vw,2rem); }
            .bottom-shelf { height: 48px; }
            .hud-bl,.hud-br { bottom: 56px; }
            #p-cont { bottom: 100px; width: 220px; right: 8px; left: auto; }
            .bg-music-btn { bottom: 60px; right: 8px; }
        }

        /* Wide desktop */
        @media(min-width:1200px){
            .heart-grid {
                grid-template-columns: repeat(4, 1fr);
                --heart-sz: 140px;
                gap: 20px;
                width: min(90vw, 800px);
                margin-top: 10px;
            }
        }

        /* Touch hover fallback */
        @media(hover:none) and (pointer:coarse){
            .heart-link:active {
                transform: translateY(-12px) rotateX(8deg) scale(1.07) !important;
            }
        }

        /* Scrollbar styling */
        .s-list::-webkit-scrollbar{width:3px}
        .s-list::-webkit-scrollbar-track{background:transparent}
        .s-list::-webkit-scrollbar-thumb{background:var(--accent);border-radius:2px}
    </style>
</head>

<body>

<!-- Heart Grid: 12 entries in 4-column layout -->
<div class="heart-grid" id="heartGrid">

    <svg id="speakerIcon" viewBox="0 0 24 24">
        <path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/>
    </svg>

<div id="p-cont" class="paused">
    <div class="p-header">
        <div class="eq"><span></span><span></span><span></span></div>
        <div id="t-name">preparing...</div>
    </div>
    <div class="ctrls">
        <button onclick="prevT()">PREV</button>
        <button id="p-btn" onclick="toggleP()">PLAY</button>
        <button onclick="nextT()">NEXT</button>
    </div>
    <div class="s-list" id="pl"></div>
</div>

<script>
/* ── [0] DAY-OF-WEEK THEME ── */
(function(){
    const days = ['SUN','MON','TUE','WED','THU','FRI','SAT'];
    const dayNames = {
        0:'SUNDAY · SUN', 1:'MONDAY · MON', 2:'TUESDAY · TUE',
        3:'WEDNESDAY · WED', 4:'THURSDAY · THU', 5:'FRIDAY · FRI', 6:'SATURDAY · SAT'
    };
    const d = new Date().getDay();
    document.body.classList.add('day-' + d);
    const badge = document.getElementById('dayBadge');
    if(badge) badge.textContent = dayNames[d];
})();

/* ── [1] 4D CANVAS ── */
(function(){
    const canvas = document.getElementById('bg-canvas');
    if(!canvas) return;
    const ctx = canvas.getContext('2d');
    let W, H, pts = [];
    const COUNT = window.innerWidth < 768 ? 35 : 60;
    const CONNECT_DIST = window.innerWidth < 768 ? 100 : 140;
    function resize(){ W=canvas.width=window.innerWidth; H=canvas.height=window.innerHeight; }
    function initPts(){
        pts=[];
        for(let i=0;i<COUNT;i++){
            pts.push({x:Math.random()*W,y:Math.random()*H,
                vx:(Math.random()-.5)*0.4,vy:(Math.random()-.5)*0.4,
                r:Math.random()*1.5+0.5,depth:Math.random()});
        }
    }
    let mx=window.innerWidth/2,my=window.innerHeight/2;
    window.addEventListener('mousemove',e=>{mx=e.clientX;my=e.clientY});
    window.addEventListener('touchmove',e=>{mx=e.touches[0].clientX;my=e.touches[0].clientY},{passive:true});
    function getAccentRGB(){
        const s=getComputedStyle(document.body).getPropertyValue('--accent').trim();
        const m=s.match(/\d+/g);
        if(m&&m.length>=3) return `${m[0]},${m[1]},${m[2]}`;
        return '0,255,163';
    }
    function draw(){
        ctx.clearRect(0,0,W,H);
        const rgb=getAccentRGB();
        pts.forEach(p=>{
            const dx=p.x-mx,dy=p.y-my,d=Math.sqrt(dx*dx+dy*dy);
            if(d<100){p.vx+=dx/d*0.25;p.vy+=dy/d*0.25;}
            p.vx*=0.99;p.vy*=0.99;p.x+=p.vx;p.y+=p.vy;
            if(p.x<0||p.x>W)p.vx*=-1;if(p.y<0||p.y>H)p.vy*=-1;
            ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);
            ctx.fillStyle=`rgba(${rgb},${0.2+p.depth*0.4})`;ctx.fill();
        });
        for(let i=0;i<pts.length;i++){
            for(let j=i+1;j<pts.length;j++){
                const dx=pts[i].x-pts[j].x,dy=pts[i].y-pts[j].y;
                const d=Math.sqrt(dx*dx+dy*dy);
                if(d<CONNECT_DIST){
                    ctx.beginPath();ctx.moveTo(pts[i].x,pts[i].y);ctx.lineTo(pts[j].x,pts[j].y);
                    ctx.strokeStyle=`rgba(${rgb},${(1-d/CONNECT_DIST)*0.12})`;
                    ctx.lineWidth=0.5;ctx.stroke();
                }
            }
        }
        requestAnimationFrame(draw);
    }
    window.addEventListener('resize',()=>{resize();initPts()});
    resize();initPts();draw();
})();

/* ── [2] MUSIC PLAYER ── */
const audio = document.getElementById('audio');
const pBtn = document.getElementById('p-btn');
const tName = document.getElementById('t-name');
const plEl = document.getElementById('pl');
const pCont = document.getElementById('p-cont');
const musicToggle = document.getElementById('musicToggle');
const speakerIcon = document.getElementById('speakerIcon');
const tracks = (typeof EXTERNAL_TRACKS !== 'undefined' && EXTERNAL_TRACKS.length > 0)
               ? EXTERNAL_TRACKS : ["Ega.mp3"];
let cIdx = 0;

function initP(){
    if(!tracks.length) return;
    plEl.innerHTML = tracks.map((t,i)=>
        `<div class="s-item ${i===cIdx?'active':''}" onclick="loadT(${i})">
            ${t.replace('.mp3','').replace(/_/g,' ')}
        </div>`).join('');
    loadT(0,true);
}
function loadT(idx,auto=true){
    cIdx=idx;
    audio.src=`music/${tracks[idx]}`;
    tName.innerText=tracks[idx].replace('.mp3','').replace(/_/g,' ');
    document.querySelectorAll('.s-item').forEach((it,i)=>it.classList.toggle('active',i===idx));
    if(auto){
        audio.muted=true;
        audio.play().then(()=>{
            updUI(true);
            const forceUnmute=()=>{
                audio.muted=false; audio.play(); updUI(true);
                ['click','touchstart','mousemove','keydown'].forEach(e=>window.removeEventListener(e,forceUnmute));
            };
            ['click','touchstart','mousemove','keydown'].forEach(e=>window.addEventListener(e,forceUnmute,{once:false}));
        }).catch(()=>{
            window.addEventListener('mousedown',()=>{audio.muted=false;audio.play().then(()=>updUI(true));},{once:true});
        });
    } else { updUI(false); }
}
function toggleP(){
    audio.muted=false;
    if(audio.paused){audio.play().then(()=>updUI(true));}else{audio.pause();updUI(false);}
}
function updUI(p){
    pCont.classList.toggle('paused',!p);
    if(pBtn) pBtn.innerText=p?"PAUSE":"PLAY";
    if(speakerIcon) speakerIcon.style.fill=p?"var(--accent)":"white";
}
function nextT(){audio.muted=false;cIdx=(cIdx+1)%tracks.length;loadT(cIdx);}
function prevT(){audio.muted=false;cIdx=(cIdx-1+tracks.length)%tracks.length;loadT(cIdx);}
audio.onended=nextT;
audio.volume=0.5;
if(musicToggle) musicToggle.addEventListener('click',e=>{e.stopPropagation();toggleP();});

/* ── [3] DRAG ── */
let isDrag=false,sX,sY,iX,iY;
const sD=e=>{
    if(e.target.closest('button')||e.target.closest('.s-list'))return;
    isDrag=true;
    const cX=e.type==='touchstart'?e.touches[0].clientX:e.clientX;
    const cY=e.type==='touchstart'?e.touches[0].clientY:e.clientY;
    const r=pCont.getBoundingClientRect();sX=cX;sY=cY;iX=r.left;iY=r.top;
};
const oD=e=>{
    if(!isDrag)return;
    const cX=e.type==='touchmove'?e.touches[0].clientX:e.clientX;
    const cY=e.type==='touchmove'?e.touches[0].clientY:e.clientY;
    pCont.style.left=`${iX+(cX-sX)}px`;pCont.style.top=`${iY+(cY-sY)}px`;
    pCont.style.right='auto';pCont.style.bottom='auto';
};
const eD=()=>{isDrag=false};
pCont.addEventListener('mousedown',sD);pCont.addEventListener('touchstart',sD,{passive:false});
window.addEventListener('mousemove',oD);window.addEventListener('touchmove',oD,{passive:false});
window.addEventListener('mouseup',eD);window.addEventListener('touchend',eD);

/* ── [4] PARTICLES ── */
function createParticles(){
    const c=document.getElementById('particles');
    if(!c)return;
    const n=window.innerWidth<768?18:30;
    for(let i=0;i<n;i++){
        const p=document.createElement('div');
        p.className='particle';
        p.style.left=Math.random()*100+'%';
        p.style.animationDelay=Math.random()*15+'s';
        p.style.animationDuration=(10+Math.random()*8)+'s';
        c.appendChild(p);
    }
}

/* ── [5] PARALLAX ── */
(function(){
    const rings=document.querySelectorAll('.orbit-ring');
    const nebulas=document.querySelectorAll('.nebula');
    let tx=0,ty=0,cx=0,cy=0;
    function apply(){
        cx+=(tx-cx)*0.05; cy+=(ty-cy)*0.05;
        rings.forEach((r,i)=>{
            const s=(i+1)*0.3;
            r.style.transform=`rotateX(70deg) rotateZ(${cx*s}deg) translateY(${cy*s*2}px)`;
        });
        nebulas.forEach((n,i)=>{
            n.style.transform=`translate(${cx*(i+1)*5}px,${cy*(i+1)*5}px) scale(1)`;
        });
        requestAnimationFrame(apply);
    }
    window.addEventListener('mousemove',e=>{tx=(e.clientX/window.innerWidth-.5)*20;ty=(e.clientY/window.innerHeight-.5)*10;});
    apply();
})();

/* ── [6] GRID VERTICAL CENTERING ── */
function adjustGrid(){
    const grid = document.getElementById('heartGrid');
    if(!grid) return;
    const titleH = document.querySelector('.main-title')?.offsetHeight || 60;
    const shelfH = 66;
    const available = window.innerHeight - titleH - shelfH - 20;
    grid.style.top = `calc(${titleH + 14}px + ${available/2}px)`;
    grid.style.transform = `translate(-50%, -50%)`;
}

window.onload=()=>{
    createParticles();
    initP();
    adjustGrid();

    const unlockAudio=async()=>{
        try{
            audio.muted=true;await audio.play();
            setTimeout(()=>{audio.muted=false;},300);
            updUI(true);
            window.removeEventListener('touchstart',unlockAudio);
            window.removeEventListener('click',unlockAudio);
        }catch(e){console.log(e);}
    };
    window.addEventListener('touchstart',unlockAudio,{once:true});
    window.addEventListener('click',unlockAudio,{once:true});
};
window.addEventListener('resize', adjustGrid);
</script>
