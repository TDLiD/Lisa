<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
    <title>2026 Future Hub</title>
    <script src="music/music_list.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Syne:wght@800;900&family=Space+Mono:wght@700&display=swap" rel="stylesheet">
<link rel="icon" href="data:;base64,iVBORw0KGgo=">
    <style>
        :root{
            --accent:#00ffa3;
            --glass:rgba(15,23,42,0.8);
            --heart-red:#ff4d6d;
            --purple:#a78bfa;
            --blue:#3b82f6;
            --cyan:#22d3ee;
            --bg:#020205;
        }
        *{margin:0;padding:0;box-sizing:border-box}

        body{
            margin:0;
            background:var(--bg);
            color:white;
            font-family:'Syne',sans-serif;
            overflow:hidden;
            height:100dvh;
            position:relative;
            perspective:1200px;
        }

        /* ── 4D LAYERED BACKGROUND ── */
        #bg-canvas{
            position:fixed;top:0;left:0;
            width:100%;height:100%;
            z-index:0;pointer-events:none;
        }

        /* Deep space grid floor */
        .grid-floor{
            position:fixed;
            bottom:0;left:50%;
            transform:translateX(-50%);
            width:200%;height:60%;
            background:
                linear-gradient(rgba(0,255,163,0.06) 1px,transparent 1px),
                linear-gradient(90deg,rgba(0,255,163,0.06) 1px,transparent 1px);
            background-size:60px 60px;
            transform-origin:bottom center;
            transform:translateX(-50%) rotateX(70deg);
            z-index:1;
            pointer-events:none;
            animation:gridPulse 8s ease-in-out infinite;
        }
        @keyframes gridPulse{
            0%,100%{opacity:0.4}
            50%{opacity:0.8}
        }

        /* Orbiting energy rings */
        .orbit-ring{
            position:fixed;
            border-radius:50%;
            border:1px solid;
            pointer-events:none;
            z-index:1;
            top:50%;left:50%;
            transform-origin:center center;
        }
        .ring-1{
            width:500px;height:500px;
            margin:-250px 0 0 -250px;
            border-color:rgba(0,255,163,0.15);
            transform:rotateX(70deg) rotateZ(0deg);
            animation:orbitSpin 20s linear infinite;
            box-shadow:0 0 30px rgba(0,255,163,0.1) inset;
        }
        .ring-2{
            width:700px;height:700px;
            margin:-350px 0 0 -350px;
            border-color:rgba(167,139,250,0.12);
            transform:rotateX(65deg) rotateZ(30deg);
            animation:orbitSpin 35s linear infinite reverse;
        }
        .ring-3{
            width:900px;height:900px;
            margin:-450px 0 0 -450px;
            border-color:rgba(34,211,238,0.08);
            transform:rotateX(72deg) rotateZ(-20deg);
            animation:orbitSpin 50s linear infinite;
        }
        @keyframes orbitSpin{
            from{transform:rotateX(70deg) rotateZ(0deg)}
            to{transform:rotateX(70deg) rotateZ(360deg)}
        }

        /* Gradient nebula orbs */
        .nebula{
            position:fixed;
            border-radius:50%;
            filter:blur(80px);
            pointer-events:none;
            z-index:1;
            animation:nebulaFloat 25s ease-in-out infinite;
        }
        .nb1{width:600px;height:600px;top:-10%;left:-10%;background:radial-gradient(circle,rgba(0,255,163,0.12),transparent 70%);animation-delay:0s}
        .nb2{width:700px;height:700px;bottom:-15%;right:-15%;background:radial-gradient(circle,rgba(167,139,250,0.12),transparent 70%);animation-delay:-8s}
        .nb3{width:400px;height:400px;top:40%;left:40%;background:radial-gradient(circle,rgba(59,130,246,0.1),transparent 70%);animation-delay:-15s}
        @keyframes nebulaFloat{
            0%,100%{transform:translate(0,0) scale(1)}
            33%{transform:translate(40px,-40px) scale(1.1)}
            66%{transform:translate(-30px,30px) scale(0.9)}
        }

        /* Scan beam */
        .scan-beam{
            position:fixed;
            top:0;left:-100%;
            width:3px;height:100%;
            background:linear-gradient(to bottom,transparent,rgba(0,255,163,0.4),rgba(0,255,163,0.8),rgba(0,255,163,0.4),transparent);
            z-index:2;
            pointer-events:none;
            animation:scanBeam 12s linear infinite;
            box-shadow:0 0 20px rgba(0,255,163,0.3);
        }
        @keyframes scanBeam{
            0%{left:-1%}100%{left:101%}
        }

        /* HUD corners */
        .hud{position:fixed;width:30px;height:30px;z-index:3;pointer-events:none}
        .hud-tl{top:15px;left:15px;border-top:2px solid rgba(0,255,163,0.6);border-left:2px solid rgba(0,255,163,0.6)}
        .hud-tr{top:15px;right:15px;border-top:2px solid rgba(0,255,163,0.6);border-right:2px solid rgba(0,255,163,0.6)}
        .hud-bl{bottom:85px;left:15px;border-bottom:2px solid rgba(0,255,163,0.6);border-left:2px solid rgba(0,255,163,0.6)}
        .hud-br{bottom:85px;right:15px;border-bottom:2px solid rgba(0,255,163,0.6);border-right:2px solid rgba(0,255,163,0.6)}

        /* Floating particles */
        .particles{position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:2}
        .particle{
            position:absolute;width:3px;height:3px;
            background:var(--accent);border-radius:50%;opacity:0;
            animation:floatUp 15s infinite;
            box-shadow:0 0 8px var(--accent);
        }
        @keyframes floatUp{
            0%{transform:translateY(100vh) translateX(0);opacity:0}
            10%{opacity:0.4}90%{opacity:0.4}
            100%{transform:translateY(-20vh) translateX(60px);opacity:0}
        }

        /* ── HEART CONTAINER ── */
        .heart-container{
            position:absolute;
            top:48%;left:50%;
            transform:translate(-50%,-50%);
            display:flex;
            gap:50px;
            z-index:100;
            perspective:2000px;
            width:100%;
            max-width:960px;
            justify-content:center;
            align-items:center;
            padding:0 20px;
        }

        .heart-link{
            position:relative;
            text-align:center;
            text-decoration:none;
            transition:.6s cubic-bezier(.23,1,.32,1);
            transform-style:preserve-3d;
            filter:drop-shadow(0 10px 30px rgba(0,0,0,0.6));
            flex:0 0 auto;
        }
        .heart-link::before{
            content:'';position:absolute;
            top:50%;left:50%;
            transform:translate(-50%,-50%) translateZ(-20px);
            width:280px;height:280px;
            border-radius:50%;
            background:radial-gradient(circle,transparent 40%,currentColor 40%,currentColor 42%,transparent 42%);
            opacity:0.2;
            animation:pulse 3s ease-in-out infinite;
            pointer-events:none;
        }
        @keyframes pulse{
            0%,100%{transform:translate(-50%,-50%) translateZ(-20px) scale(1);opacity:0.2}
            50%{transform:translate(-50%,-50%) translateZ(-20px) scale(1.15);opacity:0.4}
        }
        .heart-link:hover{
            transform:translateY(-18px) rotateX(10deg) scale(1.06);
            filter:drop-shadow(0 25px 60px rgba(0,255,163,0.5));
        }
        .heart-link:hover .heart-visual{
            filter:brightness(1.3) saturate(1.4);
            transform:translateZ(80px) rotateZ(-5deg);
        }
        .heart-visual{
            position:relative;
            width:220px;height:220px;
            margin-bottom:14px;
            background-size:cover;
            background-position:center;
            -webkit-mask-image:url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>');
            mask-image:url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>');
            -webkit-mask-size:contain;mask-size:contain;
            transition:.6s cubic-bezier(.23,1,.32,1);
            transform:translateZ(50px);
            border-radius:20px;
        }
        .heart-old{background-image:url('images/old/image-035.png');color:var(--heart-red)}
        .heart-feb{background-image:url('images/2026-02/image-018.jpg');color:var(--accent)}
        .heart-mar{background-image:url('images/2026-03/image-013.jpg');color:var(--cyan)}
.heart-apr{background-image:url('images/2026-04/image-18.jpg');color:var(--blue)}
        .heart-label{
            font-family:'Space Mono',monospace;
            font-size:10px;
            font-weight:700;
            letter-spacing:3px;
            text-transform:uppercase;
            position:relative;
            padding:8px 16px;
            background:rgba(255,255,255,0.04);
            border-radius:20px;
            backdrop-filter:blur(10px);
            border:1px solid currentColor;
            transition:0.4s;
            transform:translateZ(30px);
        }
        .heart-link:hover .heart-label{
            background:rgba(255,255,255,0.1);
            box-shadow:0 0 20px currentColor;
        }

        /* ── MAIN TITLE ── */
        .main-title{
            position:absolute;
            top:50%;left:50%;
            transform:translate(-50%,-50%);
            text-align:center;
            pointer-events:none;
            z-index:10;width:100%;
        }
        .main-title h1{
            font-family:'Bebas Neue',sans-serif;
            font-size:clamp(4rem,12vw,8rem);
            letter-spacing:4px;
            background:linear-gradient(135deg,rgba(0,255,163,0.08),rgba(167,139,250,0.08),rgba(59,130,246,0.06));
            -webkit-background-clip:text;background-clip:text;
            -webkit-text-fill-color:transparent;
            white-space:nowrap;
            animation:titleGlow 4s ease-in-out infinite;
        }
        @keyframes titleGlow{
            0%,100%{opacity:0.07;filter:blur(3px)}
            50%{opacity:0.15;filter:blur(0)}
        }

        /* ── BOTTOM SHELF ── */
        .bottom-shelf{
            position:fixed;bottom:0;width:100%;
            height:70px;
            background:linear-gradient(to right,rgba(0,0,0,0.9),rgba(2,6,23,0.95),rgba(0,0,0,0.9));
            overflow:hidden;
            border-top:1px solid rgba(0,255,163,0.25);
            z-index:50;
            display:flex;align-items:center;
        }
        .text-track{
            display:flex;width:max-content;
            animation:slideText 15s linear infinite;
            white-space:nowrap;
        }
        .lisa-text{
            font-family:'Bebas Neue',sans-serif;
            font-size:clamp(32px,6vw,50px);
            font-weight:900;
            margin:0 30px;color:#fff;
            text-transform:uppercase;
            font-style:italic;
            letter-spacing:5px;
            text-shadow:0 0 10px var(--accent),0 0 20px var(--accent);
            animation:flash 1.5s infinite alternate;
        }
        @keyframes slideText{from{transform:translateX(0)}to{transform:translateX(-50%)}}
        @keyframes flash{
            0%,100%{color:#fff;text-shadow:0 0 10px var(--accent),0 0 20px var(--accent),0 0 40px var(--purple);filter:brightness(1)}
            33%{color:var(--accent);text-shadow:0 0 20px #fff,0 0 30px var(--blue);filter:brightness(1.5) skewX(-2deg)}
            66%{color:var(--purple);text-shadow:0 0 20px var(--accent),0 0 40px #ff00de;filter:brightness(1.2) skewX(2deg)}
        }

        /* ── MUSIC PLAYER ── */
        #p-cont{
            position:fixed;
            bottom:140px;right:16px;
            width:260px;
            background:linear-gradient(135deg,rgba(2,6,23,0.97),rgba(15,23,42,0.95));
            backdrop-filter:blur(30px);
            border:1px solid rgba(0,255,163,0.3);
            border-radius:24px;
            z-index:10000;padding:16px;
            box-shadow:0 25px 60px rgba(0,0,0,0.7),0 0 40px rgba(0,255,163,0.05);
            touch-action:none;cursor:grab;
            transition:transform 0.3s;
        }
        #p-cont:active{cursor:grabbing}
        .p-header{display:flex;align-items:center;gap:8px;margin-bottom:12px}
        .eq{display:flex;align-items:flex-end;gap:2px;height:14px;padding:4px;background:rgba(0,255,163,0.1);border-radius:8px}
        .eq span{width:3px;background:linear-gradient(to top,var(--accent),var(--purple));border-radius:2px;animation:eq .8s infinite alternate}
        .eq span:nth-child(2){animation-delay:.2s}
        .eq span:nth-child(3){animation-delay:.4s}
        @keyframes eq{0%{height:4px}100%{height:14px}}
        .paused .eq span{animation-play-state:paused;height:4px}
        #t-name{font-size:11px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1;color:var(--accent);font-family:'Space Mono',monospace}
        .ctrls{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
        .ctrls button{
            background:rgba(255,255,255,0.04);
            border:1px solid rgba(255,255,255,.12);
            color:white;height:36px;border-radius:10px;
            font-size:11px;cursor:pointer;transition:0.3s;
            font-family:'Space Mono',monospace;
        }
        .ctrls button:hover{background:var(--accent);color:black;border-color:var(--accent)}
        .s-list{max-height:80px;overflow-y:auto;font-size:10px;background:rgba(0,0,0,.3);border-radius:10px;padding:6px}
        .s-item{padding:7px;cursor:pointer;opacity:.5;border-radius:6px;transition:0.3s;font-family:'Space Mono',monospace}
        .s-item:hover{opacity:0.8;background:rgba(255,255,255,0.05)}
        .s-item.active{opacity:1;background:rgba(0,255,163,.15);color:var(--accent)}

/* ── RESPONSIVE ── */

/* 1. 일반 모바일 & 태블릿 (768px 이하) */
@media(max-width: 768px) {
    .heart-container {
        flex-direction: column;
        gap: 16px;
        top: 42%;
        padding: 0 16px;
    }
    .heart-visual {
        width: 160px !important;
        height: 160px !important;
        margin-bottom: 10px;
    }
    .heart-link::before {
        width: 190px !important;
        height: 190px !important;
    }
    .heart-label {
        font-size: 9px;
        padding: 6px 12px;
        letter-spacing: 2px;
    }
    .ring-1 { width: 300px; height: 300px; margin: -150px 0 0 -150px; }
    .ring-2 { width: 440px; height: 440px; margin: -220px 0 0 -220px; }
    .ring-3 { width: 580px; height: 580px; margin: -290px 0 0 -290px; }
    
    #p-cont {
        width: calc(100vw - 32px);
        right: 16px;
        left: 16px;
        bottom: 130px;
    }
    .hud-bl, .hud-br { bottom: 78px; }
}

/* 2. 초소형 모바일 (480px 이하) */
@media(max-width: 480px) {
    .heart-container {
        gap: 16px;
        top: 42%;
    }
    .heart-visual {
        width: 130px !important;
        height: 130px !important;
    }
    .heart-link::before {
        width: 155px !important;
        height: 155px !important;
    }
}

/* 3. 가로 모드 모바일 (높이가 낮을 때) */
@media(max-height: 500px) and (orientation: landscape) {
    .heart-container {
        flex-direction: row;
        top: 45%;
        gap: 20px;
    }
    .heart-visual {
        width: 110px !important;
        height: 110px !important;
    }
    .heart-link::before {
        width: 130px !important;
        height: 130px !important;
    }
    .heart-label { font-size: 8px; padding: 4px 10px; }
    .bottom-shelf { height: 50px; }
    .lisa-text { font-size: 28px; }
    #p-cont { bottom: 100px; width: 220px; right: 10px; left: auto; }
}

/* 4. 중형 태블릿 (769px ~ 1024px) */
@media(min-width: 769px) and (max-width: 1024px) {
    .heart-container {
        flex-wrap: wrap;
        gap: 30px;
        max-width: 600px;
    }
    .heart-visual {
        width: 160px !important;
        height: 160px !important;
    }
}
/* 스타일 하단부에 추가되어 있던 #p-cont 수정 및 버튼 숨김 코드를 아래로 대체하세요 */

#p-cont {
    position: fixed;
    bottom: 140px; /* 위치 조정 */
    right: 16px;
    width: 260px;
    background: linear-gradient(135deg, rgba(2,6,23,0.97), rgba(15,23,42,0.95));
    backdrop-filter: blur(30px);
    border: 1px solid rgba(0,255,163,0.3);
    border-radius: 24px;
    z-index: 10000;
    padding: 16px;
    box-shadow: 0 25px 60px rgba(0,0,0,0.7);
    touch-action: none;
    cursor: grab;
}

/* 숨겨졌던 요소들 다시 표시 */
.ctrls { 
    display: grid; 
    grid-template-columns: repeat(3, 1fr); 
    gap: 8px; 
    margin-bottom: 12px; 
}
.ctrls button { 
    display: block !important; /* 다시 보이게 수정 */
    background: rgba(255,255,255,0.04);
    border: 1px solid rgba(255,255,255,.12);
    color: white;
    height: 36px;
    border-radius: 10px;
    font-size: 11px;
    cursor: pointer;
    font-family: 'Space Mono', monospace;
}
.ctrls button:hover { background: var(--accent); color: black; }
.s-list { 
    display: block !important; /* 리스트 다시 보이게 수정 */
    max-height: 80px; 
    overflow-y: auto; 
    background: rgba(0,0,0,.3); 
    border-radius: 10px; 
    padding: 6px; 
}
/* 스피커 버튼 스타일 */
.bg-music-btn {
    position: fixed;
    bottom: 90px; /* LISA 텍스트 트랙 바로 위 위치 */
    left: 50%;
    transform: translateX(-50%);
    z-index: 10001;
    background: rgba(0, 255, 163, 0.1);
    border: 1px solid var(--accent);
    border-radius: 50%;
    width: 50px;
    height: 50px;
    cursor: pointer;
    display: flex;
    justify-content: center;
    align-items: center;
    transition: all 0.3s ease;
    backdrop-filter: blur(5px);
    box-shadow: 0 0 15px rgba(0, 255, 163, 0.3);
}

.bg-music-btn:hover {
    background: var(--accent);
    box-shadow: 0 0 25px var(--accent);
}

.bg-music-btn svg {
    width: 24px;
    height: 24px;
    fill: var(--accent);
    transition: fill 0.3s;
}

.bg-music-btn:hover svg {
    fill: black;
}

/* 음악 정지 상태일 때 스타일 */
.bg-music-btn.muted {
    border-color: #666;
    opacity: 0.6;
}

.bg-music-btn.muted svg {
    fill: #666;
}
    </style>

</head>

<audio id="bgAudio" loop>

<button id="musicToggle" class="bg-music-btn" title="Toggle Music">
    <svg id="speakerIcon" viewBox="0 0 24 24">
        <path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/>
    </svg>
</button>

<div id="p-cont" class="paused">
    <div class="p-header">
        <div class="eq"><span></span><span></span><span></span></div>
        <div id="t-name">preparing...</div>
    </div>
    <div class="ctrls">
        <button onclick="prevT()">PREV</button>
        <button id="p-btn" onclick="toggleP()">PLAY</button>
        <button onclick="nextT()">NEXT</button>
    </div>
    <div class="s-list" id="pl"></div> <audio id="audio" loop></audio>
</div>

    <script>
        /* ── 4D CANVAS: fluid connected dots ── */
        (function(){
            const canvas = document.getElementById('bg-canvas');
            const ctx = canvas.getContext('2d');
            let W, H, pts = [];
            const COUNT = window.innerWidth < 768 ? 40 : 70;
            const CONNECT_DIST = window.innerWidth < 768 ? 120 : 160;

            function resize(){
                W = canvas.width = window.innerWidth;
                H = canvas.height = window.innerHeight;
            }

            function initPts(){
                pts = [];
                for(let i=0;i<COUNT;i++){
                    pts.push({
                        x:Math.random()*W, y:Math.random()*H,
                        vx:(Math.random()-.5)*0.4,
                        vy:(Math.random()-.5)*0.4,
                        r:Math.random()*1.5+0.5,
                        depth:Math.random()
                    });
                }
            }

            let mx=W/2, my=H/2;
            window.addEventListener('mousemove',e=>{mx=e.clientX;my=e.clientY});
            window.addEventListener('touchmove',e=>{mx=e.touches[0].clientX;my=e.touches[0].clientY},{passive:true});

            function draw(){
                ctx.clearRect(0,0,W,H);
                // mouse repulsion + move
                pts.forEach(p=>{
                    const dx=p.x-mx, dy=p.y-my;
                    const d=Math.sqrt(dx*dx+dy*dy);
                    if(d<100){
                        p.vx += dx/d*0.3;
                        p.vy += dy/d*0.3;
                    }
                    p.vx *= 0.99; p.vy *= 0.99;
                    p.x+=p.vx; p.y+=p.vy;
                    if(p.x<0||p.x>W) p.vx*=-1;
                    if(p.y<0||p.y>H) p.vy*=-1;
                    // draw dot
                    const alpha = 0.2 + p.depth*0.4;
                    ctx.beginPath();
                    ctx.arc(p.x,p.y,p.r,0,Math.PI*2);
                    ctx.fillStyle=`rgba(0,255,163,${alpha})`;
                    ctx.fill();
                });
                // draw connections
                for(let i=0;i<pts.length;i++){
                    for(let j=i+1;j<pts.length;j++){
                        const dx=pts[i].x-pts[j].x, dy=pts[i].y-pts[j].y;
                        const d=Math.sqrt(dx*dx+dy*dy);
                        if(d<CONNECT_DIST){
                            const alpha=(1-d/CONNECT_DIST)*0.15;
                            ctx.beginPath();
                            ctx.moveTo(pts[i].x,pts[i].y);
                            ctx.lineTo(pts[j].x,pts[j].y);
                            ctx.strokeStyle=`rgba(0,255,163,${alpha})`;
                            ctx.lineWidth=0.5;
                            ctx.stroke();
                        }
                    }
                }
                requestAnimationFrame(draw);
            }

            window.addEventListener('resize',()=>{resize();initPts()});
            resize(); initPts(); draw();
        })();

        /* ── PARALLAX on device tilt / mouse ── */
        (function(){
            const rings = document.querySelectorAll('.orbit-ring');
            const nebulas = document.querySelectorAll('.nebula');
            let tx=0,ty=0,cx=0,cy=0;

            function apply(){
                cx += (tx-cx)*0.05;
                cy += (ty-cy)*0.05;
                rings.forEach((r,i)=>{
                    const s=(i+1)*0.3;
                    r.style.transform=`rotateX(70deg) rotateZ(${cx*s}deg) translateY(${cy*s*2}px)`;
                });
                nebulas.forEach((n,i)=>{
                    n.style.transform=`translate(${cx*(i+1)*5}px,${cy*(i+1)*5}px) scale(1)`;
                });
                requestAnimationFrame(apply);
            }

            window.addEventListener('mousemove',e=>{
                tx=(e.clientX/window.innerWidth-.5)*20;
                ty=(e.clientY/window.innerHeight-.5)*10;
            });
            window.addEventListener('deviceorientation',e=>{
                if(e.gamma!=null){tx=e.gamma*0.4;ty=e.beta*0.2}
            });
            apply();
        })();

        /* ── PARTICLES ── */
        function createParticles(){
            const container=document.getElementById('particles');
            const n = window.innerWidth < 768 ? 20 : 35;
            for(let i=0;i<n;i++){
                const p=document.createElement('div');
                p.className='particle';
                p.style.left=Math.random()*100+'%';
                p.style.animationDelay=Math.random()*15+'s';
                p.style.animationDuration=(10+Math.random()*10)+'s';
                container.appendChild(p);
            }
        }

/* 스크립트 내의 MUSIC PLAYER 로직을 아래와 같이 수정하세요 */

const audio = document.getElementById('audio');
const pBtn = document.getElementById('p-btn');
const tName = document.getElementById('t-name');
const plEl = document.getElementById('pl');
const pCont = document.getElementById('p-cont');

// music_list.js에 EXTERNAL_TRACKS가 있으면 그것을 사용, 없으면 Ega.mp3 사용
const tracks = (typeof EXTERNAL_TRACKS !== 'undefined' && EXTERNAL_TRACKS.length > 0) 
               ? EXTERNAL_TRACKS 
               : ["Ega.mp3"];
let cIdx = 0;

function initP() {
    if (tracks.length > 0) {
        // 플레이리스트 UI 생성 복구
        plEl.innerHTML = tracks.map((t, i) => 
            `<div class="s-item ${i === cIdx ? 'active' : ''}" onclick="loadT(${i})">
                ${t.replace('.mp3', '').replace(/_/g, ' ')}
            </div>`
        ).join('');
        loadT(0, false);
    }

    // 사용자 상호작용 시 첫 재생 허용
    window.addEventListener('click', () => {
        if (audio.paused && audio.src) {
            // toggleP(); // 필요 시 자동재생 활성화
        }
    }, { once: true });
}

// 나머지 loadT, toggleP, nextT, prevT 함수는 기존 소스 코드를 그대로 유지하시면 됩니다.

        function loadT(idx,a=true){
            if(!tracks.length)return;
            cIdx=idx;
            audio.src=`music/${tracks[idx]}`;
            tName.innerText=tracks[idx].replace('.mp3','').replace(/_/g,' ');
            document.querySelectorAll('.s-item').forEach((it,i)=>it.classList.toggle('active',i===idx));
            if(a)audio.play().then(()=>updUI(true));else updUI(false);
        }
        function toggleP(){if(audio.paused)audio.play().then(()=>updUI(true));else{audio.pause();updUI(false)}}
        function updUI(p){pCont.classList.toggle('paused',!p);pBtn.innerText=p?"PAUSE":"PLAY"}
        function nextT(){cIdx=(cIdx+1)%tracks.length;loadT(cIdx)}
        function prevT(){cIdx=(cIdx-1+tracks.length)%tracks.length;loadT(cIdx)}
        audio.onended=nextT;

        /* ── DRAG ── */
        let isDrag=false,sX,sY,iX,iY;
        const sD=(e)=>{
            if(e.target.closest('button')||e.target.closest('.s-list'))return;
            isDrag=true;
            const cX=e.type==='touchstart'?e.touches[0].clientX:e.clientX;
            const cY=e.type==='touchstart'?e.touches[0].clientY:e.clientY;
            const r=pCont.getBoundingClientRect();
            sX=cX;sY=cY;iX=r.left;iY=r.top;
        };
        const oD=(e)=>{
            if(!isDrag)return;
            const cX=e.type==='touchmove'?e.touches[0].clientX:e.clientX;
            const cY=e.type==='touchmove'?e.touches[0].clientY:e.clientY;
            pCont.style.left=`${iX+(cX-sX)}px`;
            pCont.style.top=`${iY+(cY-sY)}px`;
            pCont.style.right='auto';pCont.style.bottom='auto';
        };
        const eD=()=>{isDrag=false};
        pCont.addEventListener('mousedown',sD);
        pCont.addEventListener('touchstart',sD,{passive:false});
        window.addEventListener('mousemove',oD);
        window.addEventListener('touchmove',oD,{passive:false});
        window.addEventListener('mouseup',eD);
        window.addEventListener('touchend',eD);

/* 배경 음악 컨트롤 로직 */
(function() {
    const bgAudio = document.getElementById('bgAudio');
    const musicBtn = document.getElementById('musicToggle');

    // 재생/일시정지 토글 함수
    function toggleMusic() {
        if (bgAudio.paused) {
            bgAudio.play().catch(e => console.log("재생 실패:", e));
            musicBtn.classList.remove('muted');
        } else {
            bgAudio.pause();
            musicBtn.classList.add('muted');
        }
    }

    musicBtn.addEventListener('click', (e) => {
        e.stopPropagation(); 
        toggleMusic();
    });

    // 핵심: 페이지 로드 후 사용자가 "어디든 클릭"하면 자동 재생 실행
    const autoPlayStarter = () => {
        bgAudio.play().then(() => {
            musicBtn.classList.remove('muted');
            // 재생에 성공하면 클릭 이벤트 제거
            window.removeEventListener('click', autoPlayStarter);
            window.removeEventListener('touchstart', autoPlayStarter);
        }).catch(error => {
            console.log("브라우저 차단으로 대기 중...");
        });
    };

    window.addEventListener('click', autoPlayStarter);
    window.addEventListener('touchstart', autoPlayStarter); // 모바일 대응

    bgAudio.volume = 0.5;
})();

        window.onload=()=>{
            createParticles();
            initP();
        };
    </script>
</body>
</html>
